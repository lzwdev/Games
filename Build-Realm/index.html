/* =========================================================
   HELPERS
   ========================================================= */
function getCost(type, level) {
  const def = BUILDINGS[type];
  if (level === 0) return Math.round(def.cost);
  return Math.round(def.baseCost * Math.pow(def.costMult, level));
}
function getUpgradeCost(b) { return getCost(b.type, b.level); }
function costString(type, level) { return getCost(type, level).toLocaleString('de-DE'); }

/* Bauzeit in Sekunden (Basis × Level-Faktor × Größe) */
function getBuildTime(type, level) {
  const def = BUILDINGS[type];
  const base = def.buildTime || 8;
  const sizeFactor = def.size === 3 ? 1.6 : def.size === 2 ? 1.2 : 1;
  if (level === 0) return Math.round(base * sizeFactor);
  return Math.round(base * sizeFactor * (0.8 + level * 0.4));
}
function formatTime(sec) {
  sec = Math.max(0, Math.ceil(sec));
  if (sec < 60) return sec + 's';
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  if (m < 60) return m + 'm ' + s + 's';
  const h = Math.floor(m / 60);
  return h + 'h ' + (m % 60) + 'm';
}

/* =========================================================
   RECALC / PRODUCTION
   ========================================================= */
function recalc() {
  let popCap = 0, workerNeed = 0, soldierCap = 0, happy = 0;
  state.buildings.forEach(b => {
    if (b.construction) return; // Baustellen zählen nicht
    const def = BUILDINGS[b.type];
    if (def.popPerLevel) popCap += def.popPerLevel[b.level-1] || 0;
    if (def.popBonus && b.type === 'main') popCap += def.popBonus[b.level-1] || 0;
    if (def.soldierPerLevel) soldierCap += def.soldierPerLevel[b.level-1] || 0;
    if (def.soldierBonus && b.type === 'main') soldierCap += def.soldierBonus[b.level-1] || 0;
    if (def.needs && def.needs.workers) workerNeed += def.needs.workers * b.level;
    if (def.happyBonus) happy += def.happyBonus[b.level-1] || 0;
  });
  state.populationCap = Math.max(10, popCap);
  state.workersNeeded = workerNeed;
  state.soldierCap = Math.max(2, soldierCap);
  state.happiness = Math.min(100, 60 + happy);
  if (state.population > state.populationCap) state.population = state.populationCap;
  state.workers = Math.max(0, Math.min(state.workersNeeded, state.population - state.soldiers));
  if (state.soldiers > state.soldierCap) state.soldiers = state.soldierCap;
}

function productionTick(dt) {
  if (!state.buildings.length) return;
  dt = dt || 1;
  let globalMult = 1;
  state.buildings.forEach(b => {
    if (b.construction) return;
    const def = BUILDINGS[b.type];
    if (def.globalBonus) globalMult += def.globalBonus[b.level-1] || 0;
  });
  const workerRatio = state.workersNeeded > 0 ? Math.min(1, state.workers / state.workersNeeded) : 1;
  const happyMult = 0.7 + (state.happiness / 100) * 0.5;
  let prod = { gold: 0, food: 0, wood: 0, stone: 0 };
  state.buildings.forEach(b => {
    if (b.construction) return;
    const def = BUILDINGS[b.type];
    if (def.produces) {
      for (const k in def.produces) {
        prod[k] += def.produces[k] * b.level * workerRatio * globalMult * happyMult * dt;
      }
    }
    if (b.type === 'farm' && b.level >= def.factoryLevel) {
      prod.food += 8 * b.level * workerRatio * globalMult * dt;
      prod.gold += 4 * b.level * workerRatio * globalMult * dt;
    }
  });
  state.gold += Math.floor(prod.gold);
  state.food += Math.floor(prod.food);
  state.wood += Math.floor(prod.wood);
  state.stone += Math.floor(prod.stone);
  const tax = Math.floor((state.population * 1.4 + state.buildings.length * 0.9) * dt * (state.happiness/100));
  state.money += tax;
  if (state.population < state.populationCap && state.food > state.population * 2) {
    if (Math.random() < 0.25 * dt * (state.happiness/100)) state.population++;
  }
  const foodUse = Math.floor(state.population * 0.35 * dt);
  if (state.food >= foodUse) state.food -= foodUse;
  else { state.food = 0; if (Math.random() < 0.3 * dt && state.population > 2) state.population--; }
}

/* =========================================================
   MAP / CAMERA
   ========================================================= */
const mapEl = document.getElementById('map');
const tooltip = document.getElementById('tooltip');
const ghost = document.getElementById('placeGhost');
const worldEl = document.getElementById('world');

let isDragging = false, dragStart = {x:0,y:0}, dragMoved = false;

function applyTransform() {
  worldEl.style.transform = `translate(${state.camX}px, ${state.camY}px) scale(${state.zoom})`;
  updateMinimapView();
}

mapEl.addEventListener('mousedown', (e) => {
  if (e.button === 0 && !state.placing && !state.sellMode) {
    isDragging = true; dragMoved = false;
    dragStart = { x: e.clientX - state.camX, y: e.clientY - state.camY };
    mapEl.classList.add('dragging');
  }
  if (e.button === 2) cancelPlacing();
});
window.addEventListener('mousemove', (e) => {
  if (isDragging) {
    const nx = e.clientX - dragStart.x;
    const ny = e.clientY - dragStart.y;
    if (Math.abs(nx - state.camX) > 3 || Math.abs(ny - state.camY) > 3) dragMoved = true;
    state.camX = nx; state.camY = ny;
    applyTransform();
  }
  updateGhost(e);
  if (tooltip.style.display === 'block') {
    tooltip.style.left = (e.clientX + 16) + 'px';
    tooltip.style.top = (e.clientY + 16) + 'px';
  }
});
window.addEventListener('mouseup', () => { isDragging = false; mapEl.classList.remove('dragging'); });

mapEl.addEventListener('wheel', (e) => {
  e.preventDefault();
  const oldZoom = state.zoom;
  const delta = e.deltaY > 0 ? 0.88 : 1.14;
  state.zoom = Math.max(0.35, Math.min(2.6, state.zoom * delta));
  const rect = mapEl.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  state.camX = mx - (mx - state.camX) * (state.zoom / oldZoom);
  state.camY = my - (my - state.camY) * (state.zoom / oldZoom);
  applyTransform();
}, { passive: false });

mapEl.addEventListener('click', (e) => {
  if (dragMoved) return;
  if (state.placing) { placeBuilding(e); return; }
  if (state.sellMode) {
    const w = screenToWorld(e.clientX, e.clientY);
    let hit = null;
    for (const b of state.buildings) {
      if (b.type === 'main') continue;
      const bs = BUILDINGS[b.type].size * TILE;
      if (w.x >= b.x && w.x <= b.x + bs && w.y >= b.y && w.y <= b.y + bs) { hit = b; break; }
    }
    if (hit) sellBuilding(hit);
    return;
  }
  hideDetailPanel();
  document.querySelectorAll('.building.selected').forEach(el => el.classList.remove('selected'));
  state.selected = null;
});

mapEl.addEventListener('contextmenu', (e) => e.preventDefault());

window.addEventListener('keydown', (e) => {
  if (e.key === 'q' || e.key === 'Q') {
    if (state.placing) { cancelPlacing(); notify("Platzierung abgebrochen"); }
  }
  if (e.key === 'Escape') {
    if (state.placing) cancelPlacing();
    if (state.sellMode) toggleSellMode();
    hideDetailPanel();
  }
});

/* =========================================================
   PLACEMENT
   ========================================================= */
function startPlacing(type) {
  const def = BUILDINGS[type];
  if (def.unlockLevel && state.level < def.unlockLevel) {
    notify(`Benötigt Imperium-Level ${def.unlockLevel}`, true);
    return;
  }
  state.placing = type;
  ghost.style.display = 'block';
  mapEl.classList.add('placing');
  document.querySelectorAll('.bcard').forEach(c => c.classList.remove('active'));
  const card = document.querySelector(`.bcard[data-type="${type}"]`);
  if (card) card.classList.add('active');

  // Platzierungs-Banner
  const banner = document.getElementById('placeBanner');
  document.getElementById('pbIcon').innerHTML = ICONS[def.icon] || '';
  document.getElementById('pbName').textContent = def.name + ' platzieren';
  banner.classList.add('show');
}
function cancelPlacing() {
  state.placing = null;
  ghost.style.display = 'none';
  mapEl.classList.remove('placing');
  document.getElementById('placeBanner').classList.remove('show');
  document.querySelectorAll('.bcard').forEach(c => c.classList.remove('active'));
}
function screenToWorld(clientX, clientY) {
  const rect = mapEl.getBoundingClientRect();
  return {
    x: (clientX - rect.left - state.camX) / state.zoom,
    y: (clientY - rect.top - state.camY) / state.zoom
  };
}
function updateGhost(e) {
  if (!state.placing) return;
  const def = BUILDINGS[state.placing];
  const size = def.size * TILE;
  const w = screenToWorld(e.clientX, e.clientY);
  const gx = w.x - size / 2;
  const gy = w.y - size / 2;
  ghost.style.width = size + 'px';
  ghost.style.height = size + 'px';
  ghost.style.left = '0'; ghost.style.top = '0';
  ghost.style.transform = `translate(${state.camX + gx * state.zoom}px, ${state.camY + gy * state.zoom}px) scale(${state.zoom})`;
  ghost.style.transformOrigin = '0 0';
  let collision = false;
  for (const b of state.buildings) {
    const bs = BUILDINGS[b.type].size * TILE;
    if (gx < b.x + bs && gx + size > b.x && gy < b.y + bs && gy + size > b.y) { collision = true; break; }
  }
  if (gx < 0 || gy < 0 || gx + size > 6000 || gy + size > 6000) collision = true;
  ghost.classList.toggle('invalid', collision);
}
function placeBuilding(e) {
  const def = BUILDINGS[state.placing];
  const w = screenToWorld(e.clientX, e.clientY);
  const size = def.size * TILE;
  const x = w.x - size / 2;
  const y = w.y - size / 2;
  if (x < 0 || y < 0 || x + size > 6000 || y + size > 6000) { notify("Außerhalb der Karte!", true); return; }
  const cost = getCost(state.placing, 0);
  if (state.money < cost) { notify("Nicht genug Geld!", true); return; }
  for (const b of state.buildings) {
    const bs = BUILDINGS[b.type].size * TILE;
    if (x < b.x + bs && x + size > b.x && y < b.y + bs && y + size > b.y) {
      notify("Platz ist belegt!", true); return;
    }
  }
  state.money -= cost;
  const buildTime = getBuildTime(state.placing, 0);
  const b = {
    id: state.nextId++,
    type: state.placing,
    x, y, level: 1,
    construction: true,
    constructionStart: Date.now(),
    constructionDuration: buildTime * 1000,
    constructionTotal: buildTime * 1000
  };
  state.buildings.push(b);
  createBuildingEl(b);
  updateUI();
  updateMinimapBuildings();
  notify(`${def.name} im Bau (${formatTime(buildTime)})`);
  showFloat(e.clientX, e.clientY, `-${cost.toLocaleString('de-DE')}`, '#c9532f');
  cancelPlacing();
}

/* =========================================================
   CREATE / REFRESH / CONSTRUCTION
   ========================================================= */
function createBuildingEl(b) {
  const def = BUILDINGS[b.type];
  const size = def.size * TILE;
  const el = document.createElement('div');
  el.className = 'building' + (b.construction ? ' under-construction' : '');
  el.dataset.id = b.id;
  el.style.left = b.x + 'px';
  el.style.top = b.y + 'px';
  el.style.width = size + 'px';
  el.style.height = size + 'px';
  el.style.zIndex = Math.floor(b.y);
  el.innerHTML = buildingSVG(b.type, b.level, size, size);

  if (b.construction) {
    // Bau-Overlay mit Bauarbeitern
    const overlay = document.createElement('div');
    overlay.className = 'construction-overlay';
    overlay.innerHTML = constructionOverlaySVG(b.type, size);
    el.appendChild(overlay);

    // Fortschritts-Badge + Balken
    const badge = document.createElement('div');
    badge.className = 'progress-badge';
    badge.textContent = '0%';
    el.appendChild(badge);
    const barBg = document.createElement('div');
    barBg.className = 'progress-bar-bg';
    barBg.innerHTML = '<div class="progress-bar-fill" style="width:0%"></div>';
    el.appendChild(barBg);
    b._badge = badge;
    b._barFill = barBg.firstChild;

    // Bauarbeiter
    const builderPositions = getBuilderPositions(def.size);
    b._builders = builderPositions.map(pos => {
      const bel = document.createElement('div');
      bel.className = 'builder';
      bel.innerHTML = builderSVG('#ffb74d');
      bel.style.left = (b.x + pos.x * size) + 'px';
      bel.style.top = (b.y + pos.y * size) + 'px';
      bel.style.zIndex = Math.floor(b.y) + 20;
      worldEl.appendChild(bel);
      return bel;
    });
  }

  el.addEventListener('click', (ev) => {
    ev.stopPropagation();
    if (state.placing || state.sellMode) return;
    selectBuilding(b.id);
  });
  el.addEventListener('mouseenter', (ev) => {
    if (state.placing) return;
    showTooltipForBuilding(b, ev);
  });
  el.addEventListener('mouseleave', () => { tooltip.style.display = 'none'; });

  worldEl.appendChild(el);
  b.el = el;
}

function constructionOverlaySVG(type, size) {
  // Bau-Gerüst mit Pfosten und Streben
  return `<svg viewBox="0 0 100 100" preserveAspectRatio="none">
    <rect x="2" y="2" width="96" height="96" fill="none" stroke="#8d6e63" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.7"/>
    <line x1="0" y1="100" x2="100" y2="0" stroke="#a1887f" stroke-width="1.2" opacity="0.5"/>
    <line x1="100" y1="100" x2="0" y2="0" stroke="#a1887f" stroke-width="1.2" opacity="0.5"/>
    <rect x="0" y="95" width="100" height="5" fill="#8d6e63" opacity="0.5"/>
  </svg>`;
}

function getBuilderPositions(size) {
  if (size === 3) return [
    { x: 0.15, y: 0.85 }, { x: 0.45, y: 0.85 }, { x: 0.75, y: 0.85 },
    { x: 0.15, y: 0.55 }, { x: 0.75, y: 0.55 }
  ];
  if (size === 2) return [
    { x: 0.2, y: 0.85 }, { x: 0.7, y: 0.85 }, { x: 0.5, y: 0.5 }
  ];
  return [{ x: 0.35, y: 0.85 }, { x: 0.65, y: 0.85 }];
}

function refreshBuildingEl(b) {
  const def = BUILDINGS[b.type];
  const size = def.size * TILE;
  // Bauarbeiter entfernen
  if (b._builders) { b._builders.forEach(el => el.remove()); b._builders = null; }
  b.el.classList.remove('under-construction');
  b.el.innerHTML = buildingSVG(b.type, b.level, size, size);
  b.el.style.zIndex = Math.floor(b.y);
  // Re-attach events
  b.el.onclick = (ev) => {
    ev.stopPropagation();
    if (state.placing || state.sellMode) return;
    selectBuilding(b.id);
  };
  b.el.onmouseenter = (ev) => { if (!state.placing) showTooltipForBuilding(b, ev); };
  b.el.onmouseleave = () => { tooltip.style.display = 'none'; };
}

/* Bau-Tick: prüft alle Baustellen */
function constructionTick() {
  const now = Date.now();
  let changed = false;
  for (const b of state.buildings) {
    if (!b.construction) continue;
    const elapsed = now - b.constructionStart;
    const progress = Math.min(1, elapsed / b.constructionDuration);
    if (b._barFill) b._barFill.style.width = (progress * 100) + '%';
    if (b._badge) b._badge.textContent = Math.floor(progress * 100) + '%';
    if (progress >= 1) {
      b.construction = false;
      refreshBuildingEl(b);
      changed = true;
      notify(`${BUILDINGS[b.type].name} fertiggestellt!`, false, true);
    }
  }
  if (changed) { recalc(); updateUI(); updateMinimapBuildings(); }
}

/* =========================================================
   DETAIL PANEL (rechts oben)
   ========================================================= */
function selectBuilding(id) {
  const b = state.buildings.find(x => x.id === id);
  if (!b) return;
  state.selected = b;
  document.querySelectorAll('.building.selected').forEach(el => el.classList.remove('selected'));
  if (b.el) b.el.classList.add('selected');
  showDetailPanel(b);
}

function showDetailPanel(b) {
  const def = BUILDINGS[b.type];
  const panel = document.getElementById('detailPanel');

  document.getElementById('dpIcon').innerHTML = ICONS[def.icon] || '';
  document.getElementById('dpName').textContent = def.name;
  document.getElementById('dpLevel').textContent = b.construction ? 'Im Bau…' : `Level ${b.level} / ${def.maxLevel}`;

  let bodyHTML = `<div class="dp-desc">${def.desc}</div>`;

  if (b.construction) {
    const now = Date.now();
    const progress = Math.min(1, (now - b.constructionStart) / b.constructionDuration);
    const remaining = Math.max(0, (b.constructionDuration - (now - b.constructionStart)) / 1000);
    bodyHTML += `
      <div class="dp-progress-box">
        <div class="lbl">Baufortschritt</div>
        <div class="dp-progress-bar"><div class="dp-progress-fill" id="dpProgressFill" style="width:${progress*100}%"></div></div>
        <div class="dp-progress-time" id="dpProgressTime">${formatTime(remaining)} verbleibend</div>
      </div>
    `;
  } else {
    // Stats
    let statsHTML = '';
    if (def.produces) {
      const prodStr = Object.entries(def.produces).map(([k,v]) => `${v*b.level} ${k}`).join(', ');
      statsHTML += `<div class="dp-stat"><span class="k">Produktion</span><span class="v">${prodStr}</span></div>`;
    }
    if (def.popPerLevel) statsHTML += `<div class="dp-stat"><span class="k">Bevölkerung</span><span class="v good">+${def.popPerLevel[b.level-1]}</span></div>`;
    if (def.popBonus && b.type === 'main') statsHTML += `<div class="dp-stat"><span class="k">Bevölkerung</span><span class="v good">+${def.popBonus[b.level-1]}</span></div>`;
    if (def.soldierPerLevel) statsHTML += `<div class="dp-stat"><span class="k">Soldatenlimit</span><span class="v good">+${def.soldierPerLevel[b.level-1]}</span></div>`;
    if (def.soldierBonus && b.type === 'main') statsHTML += `<div class="dp-stat"><span class="k">Soldatenlimit</span><span class="v good">+${def.soldierBonus[b.level-1]}</span></div>`;
    if (def.happyBonus) statsHTML += `<div class="dp-stat"><span class="k">Zufriedenheit</span><span class="v good">+${def.happyBonus[b.level-1]}</span></div>`;
    if (def.globalBonus) statsHTML += `<div class="dp-stat"><span class="k">Globaler Bonus</span><span class="v good">+${Math.round(def.globalBonus[b.level-1]*100)}%</span></div>`;
    if (def.needs && def.needs.workers) statsHTML += `<div class="dp-stat"><span class="k">Arbeiter</span><span class="v">${def.needs.workers * b.level}</span></div>`;
    bodyHTML += statsHTML;

    // Upgrade-Vorschau
    if (b.level < def.maxLevel) {
      const nextSize = def.size * TILE;
      const upCost = getUpgradeCost(b);
      const upTime = getBuildTime(b.type, b.level);
      bodyHTML += `
        <div class="dp-upgrade-box">
          <div class="dp-up-title">Upgrade auf Level ${b.level + 1}</div>
          <div class="dp-preview">
            <div class="prev">${buildingSVG(b.type, b.level, nextSize, nextSize)}</div>
            <div class="arrow">→</div>
            <div class="prev future">${buildingSVG(b.type, b.level+1, nextSize, nextSize)}</div>
          </div>
          <div class="dp-up-row"><span>Kosten</span><span class="v cost">${upCost.toLocaleString('de-DE')} Geld</span></div>
          <div class="dp-up-row"><span>Bauzeit</span><span class="v time">${formatTime(upTime)}</span></div>
        </div>
      `;
    } else {
      bodyHTML += `<div class="dp-upgrade-box" style="text-align:center;color:#2e7d32;font-weight:800;">Maximales Level erreicht</div>`;
    }
  }

  document.getElementById('dpBody').innerHTML = bodyHTML;

  // Aktionen
  const actions = document.getElementById('dpActions');
  actions.innerHTML = '';
  if (b.construction) {
    // Vielleicht: Beschleunigen-Button
    const speedBtn = document.createElement('button');
    speedBtn.className = 'btn btn-primary';
    speedBtn.textContent = 'Sofort fertigstellen (500 Geld)';
    speedBtn.onclick = () => {
      if (state.money < 500) { notify("Nicht genug Geld!", true); return; }
      state.money -= 500;
      b.constructionStart = Date.now() - b.constructionDuration;
      constructionTick();
      showDetailPanel(b);
      updateUI();
    };
    actions.appendChild(speedBtn);
  } else if (b.level < def.maxLevel) {
    const upBtn = document.createElement('button');
    upBtn.className = 'btn btn-primary';
    upBtn.textContent = 'Upgrade starten';
    const cost = getUpgradeCost(b);
    if (state.money < cost) { upBtn.disabled = true; upBtn.style.opacity = '0.5'; }
    upBtn.onclick = () => startUpgrade(b);
    actions.appendChild(upBtn);
  }
  const closeBtn = document.createElement('button');
  closeBtn.className = 'btn';
  closeBtn.textContent = 'Schließen';
  closeBtn.onclick = hideDetailPanel;
  actions.appendChild(closeBtn);

  panel.classList.add('show');
}

function hideDetailPanel() {
  document.getElementById('detailPanel').classList.remove('show');
  state.selected = null;
  document.querySelectorAll('.building.selected').forEach(el => el.classList.remove('selected'));
}

document.getElementById('dpClose').onclick = hideDetailPanel;

/* =========================================================
   UPGRADE mit Bauzeit
   ========================================================= */
function startUpgrade(b) {
  const def = BUILDINGS[b.type];
  if (b.level >= def.maxLevel) return;
  const cost = getUpgradeCost(b);
  if (state.money < cost) { notify("Nicht genug Geld!", true); return; }
  state.money -= cost;
  // Upgrade als Bauphase
  b.level++;
  b.construction = true;
  const buildTime = getBuildTime(b.type, b.level - 1);
  b.constructionStart = Date.now();
  b.constructionDuration = buildTime * 1000;
  b.constructionTotal = buildTime * 1000;

  // Baustellen-Overlay + Bauarbeiter
  if (b._builders) b._builders.forEach(el => el.remove());
  const size = def.size * TILE;
  b.el.classList.add('under-construction');
  b.el.innerHTML = buildingSVG(b.type, b.level, size, size);

  const overlay = document.createElement('div');
  overlay.className = 'construction-overlay';
  overlay.innerHTML = constructionOverlaySVG(b.type, size);
  b.el.appendChild(overlay);

  const badge = document.createElement('div');
  badge.className = 'progress-badge';
  badge.textContent = '0%';
  b.el.appendChild(badge);
  const barBg = document.createElement('div');
  barBg.className = 'progress-bar-bg';
  barBg.innerHTML = '<div class="progress-bar-fill" style="width:0%"></div>';
  b.el.appendChild(barBg);
  b._badge = badge;
  b._barFill = barBg.firstChild;

  const builderPositions = getBuilderPositions(def.size);
  b._builders = builderPositions.map(pos => {
    const bel = document.createElement('div');
    bel.className = 'builder';
    bel.innerHTML = builderSVG('#ffb74d');
    bel.style.left = (b.x + pos.x * size) + 'px';
    bel.style.top = (b.y + pos.y * size) + 'px';
    bel.style.zIndex = Math.floor(b.y) + 20;
    worldEl.appendChild(bel);
    return bel;
  });

  // Events neu setzen
  b.el.onclick = (ev) => { ev.stopPropagation(); if (!state.placing && !state.sellMode) selectBuilding(b.id); };
  b.el.onmouseenter = (ev) => { if (!state.placing) showTooltipForBuilding(b, ev); };
  b.el.onmouseleave = () => { tooltip.style.display = 'none'; };

  recalc();
  updateUI();
  updateMinimapBuildings();
  notify(`${def.name} Upgrade auf Level ${b.level} gestartet`);
  showDetailPanel(b);
}

/* =========================================================
   SELL MODE
   ========================================================= */
function toggleSellMode() {
  state.sellMode = !state.sellMode;
  document.getElementById('btnSellMode').classList.toggle('active', state.sellMode);
  mapEl.classList.toggle('selling', state.sellMode);
  if (state.sellMode) {
    cancelPlacing();
    hideDetailPanel();
    notify("Abriss-Modus: Klicke auf ein Gebäude");
  }
}
function sellBuilding(b) {
  if (b.type === 'main') { notify("Hauptgebäude kann nicht abgerissen werden!", true); return; }
  const totalInvested = (function() {
    let sum = getCost(b.type, 0);
    for (let i = 1; i < b.level; i++) sum += getCost(b.type, i);
    return sum;
  })();
  const refund = Math.floor(totalInvested * 0.5);
  state.money += refund;
  state.buildings = state.buildings.filter(x => x.id !== b.id);
  if (b.el) b.el.remove();
  if (b._builders) b._builders.forEach(el => el.remove());
  recalc();
  updateUI();
  updateMinimapBuildings();
  hideDetailPanel();
  notify(`Abgerissen. +${refund.toLocaleString('de-DE')} Geld`, false, true);
}

/* =========================================================
   UI UPDATE
   ========================================================= */
function updateUI() {
  const resGroup = document.getElementById('resGroup');
  const fmt = (n) => Math.floor(n).toLocaleString('de-DE');
  resGroup.innerHTML = `
    <div class="res">${ICONS.money}<span class="val">${fmt(state.money)}</span></div>
    <div class="res">${ICONS.gold}<span class="val">${fmt(state.gold)}</span></div>
    <div class="res">${ICONS.food}<span class="val">${fmt(state.food)}</span></div>
    <div class="res">${ICONS.wood}<span class="val">${fmt(state.wood)}</span></div>
    <div class="res">${ICONS.stone}<span class="val">${fmt(state.stone)}</span></div>
    <div class="res">${ICONS.pop}<span class="val">${state.population}/${state.populationCap}</span></div>
    <div class="res">${ICONS.worker}<span class="val">${state.workers}/${state.workersNeeded}</span></div>
    <div class="res">${ICONS.soldier}<span class="val">${state.soldiers}/${state.soldierCap}</span></div>
    <div class="res">${ICONS.star}<span class="val">Lv.${state.level}</span></div>
  `;
  const statsBody = document.getElementById('statsBody');
  const workerRatio = state.workersNeeded > 0 ? Math.round(state.workers/state.workersNeeded*100) : 100;
  const workerClass = workerRatio >= 80 ? 'good' : workerRatio >= 40 ? '' : 'bad';
  const constructing = state.buildings.filter(b => b.construction).length;
  statsBody.innerHTML = `
    <div class="sp-row"><span>Gebäude</span><span class="v">${state.buildings.length}</span></div>
    <div class="sp-row"><span>Im Bau</span><span class="v ${constructing>0?'':''}">${constructing}</span></div>
    <div class="sp-row"><span>Arbeiter</span><span class="v ${workerClass}">${workerRatio}%</span></div>
    <div class="sp-row"><span>Zufriedenheit</span><span class="v ${state.happiness>=70?'good':state.happiness>=40?'':'bad'}">${Math.round(state.happiness)}%</span></div>
    <div class="sp-row"><span>Militär</span><span class="v">${state.soldiers}/${state.soldierCap}</span></div>
  `;
}

/* =========================================================
   BUILDING LIST
   ========================================================= */
const buildingList = document.getElementById('buildingList');
function renderBuildingList() {
  buildingList.innerHTML = '';
  let count = 0;
  for (const key in BUILDINGS) {
    const def = BUILDINGS[key];
    if (key === 'main') continue;
    if (state.activeTab !== 'all' && def.category !== state.activeTab) continue;
    const locked = def.unlockLevel && state.level < def.unlockLevel;
    if (!locked) count++;
    const card = document.createElement('div');
    card.className = 'bcard' + (locked ? ' locked' : '');
    card.dataset.type = key;
    const buildT = getBuildTime(key, 0);
    card.innerHTML = `
      <div class="icon">${ICONS[def.icon]}</div>
      <div class="info">
        <div class="name">${def.name} ${locked?`<span class="lock">Lv.${def.unlockLevel}</span>`:''}</div>
        <div class="desc">${def.desc}</div>
        <div class="cost">${locked ? 'Gesperrt' : costString(key, 0) + ' Geld · <span class="time">' + formatTime(buildT) + '</span>'}</div>
      </div>
    `;
    if (!locked) {
      card.onclick = () => {
        if (state.money < getCost(key, 0)) { notify("Nicht genug Geld!", true); return; }
        if (state.sellMode) toggleSellMode();
        startPlacing(key);
      };
    }
    buildingList.appendChild(card);
  }
  document.getElementById('bCount').textContent = count;
}
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.activeTab = btn.dataset.cat;
    renderBuildingList();
  };
});

/* =========================================================
   TOOLTIP
   ========================================================= */
function showTooltipForBuilding(b, ev) {
  const def = BUILDINGS[b.type];
  let extra = '';
  if (b.construction) {
    const remaining = Math.max(0, (b.constructionDuration - (Date.now() - b.constructionStart)) / 1000);
    extra = `<div class="t-row" style="color:#8d6e63;font-weight:700;">Im Bau · ${formatTime(remaining)}</div>`;
  } else {
    if (def.produces) extra += `<div class="t-row">Produktion: ${Object.entries(def.produces).map(([k,v]) => `${v*b.level} ${k}`).join(', ')}</div>`;
    if (def.popPerLevel) extra += `<div class="t-row">Bevölkerung: +${def.popPerLevel[b.level-1]}</div>`;
    if (def.soldierPerLevel) extra += `<div class="t-row">Soldaten: +${def.soldierPerLevel[b.level-1]}</div>`;
    if (def.happyBonus) extra += `<div class="t-row">Zufriedenheit: +${def.happyBonus[b.level-1]}</div>`;
    if (b.level < def.maxLevel) extra += `<div class="t-row" style="color:#2f6fd0;margin-top:6px;">Upgrade: ${getUpgradeCost(b).toLocaleString('de-DE')} Geld · ${formatTime(getBuildTime(b.type, b.level))}</div>`;
  }
  tooltip.innerHTML = `
    <div class="t-title">${def.name} (Lv.${b.level})</div>
    <div class="t-row">${def.desc}</div>
    ${extra}
    <div class="t-row" style="color:#7b8dab;font-size:11px;margin-top:4px;">Klicken für Details</div>
  `;
  tooltip.style.display = 'block';
  tooltip.style.left = (ev.clientX + 16) + 'px';
  tooltip.style.top = (ev.clientY + 16) + 'px';
}

/* =========================================================
   FLOAT / NOTIFY
   ========================================================= */
function showFloat(clientX, clientY, text, color) {
  const rect = mapEl.getBoundingClientRect();
  const el = document.createElement('div');
  el.className = 'float-text';
  el.textContent = text;
  el.style.color = color || '#2e7d32';
  el.style.left = (clientX - rect.left) + 'px';
  el.style.top = (clientY - rect.top) + 'px';
  mapEl.appendChild(el);
  setTimeout(() => el.remove(), 1500);
}
function notify(msg, bad, good) {
  const n = document.createElement('div');
  n.className = 'note' + (bad ? ' bad' : good ? ' good' : '');
  n.textContent = msg;
  document.getElementById('notify').appendChild(n);
  setTimeout(() => n.remove(), 2200);
}

/* =========================================================
   WORKERS (Bewohner)
   ========================================================= */
const workers = [];
function spawnWorker() {
  const el = document.createElement('div');
  el.className = 'worker';
  const colors = ['#ffcc80', '#a5d6a7', '#90caf9', '#f48fb1', '#ce93d8', '#ffb74d', '#80cbc4'];
  const c = colors[Math.floor(Math.random()*colors.length)];
  const skin = ['#ffcc80', '#e0ac69', '#c68642', '#8d5524'][Math.floor(Math.random()*4)];
  el.innerHTML = `<svg viewBox="0 0 18 24" width="18" height="24"><circle cx="9" cy="5.5" r="4" fill="${skin}"/><path d="M4 8 Q9 3 14 8 L14 9 L4 9 Z" fill="${c}"/><rect x="4.5" y="10" width="9" height="9" rx="2" fill="${c}"/><rect x="5" y="18.5" width="3" height="5" fill="#37474f"/><rect x="10" y="18.5" width="3" height="5" fill="#37474f"/></svg>`;
  const wx = Math.random() * 6000, wy = Math.random() * 6000;
  el.style.left = wx + 'px'; el.style.top = wy + 'px';
  el.style.zIndex = Math.floor(wy) + 10;
  worldEl.appendChild(el);
  workers.push({ el, x: wx, y: wy, tx: wx, ty: wy, speed: 0.6 + Math.random()*0.9, idleTimer: Math.random()*3 });
}
function updateWorkers(dt) {
  const maxVisible = Math.min(70, Math.max(5, state.population * 2));
  while (workers.length < maxVisible) spawnWorker();
  while (workers.length > maxVisible) { const w = workers.pop(); w.el.remove(); }
  workers.forEach(w => {
    const dx = w.tx - w.x, dy = w.ty - w.y;
    const dist = Math.hypot(dx, dy);
    if (dist < 4) {
      w.idleTimer -= dt;
      if (w.idleTimer <= 0) {
        if (state.buildings.length && Math.random() < 0.75) {
          const b = state.buildings[Math.floor(Math.random()*state.buildings.length)];
          const bs = BUILDINGS[b.type].size * TILE;
          w.tx = b.x + Math.random() * bs;
          w.ty = b.y + bs + Math.random() * 50;
        } else {
          w.tx = Math.random() * 6000; w.ty = Math.random() * 6000;
        }
        w.idleTimer = 1 + Math.random() * 4;
      }
    } else {
      w.x += (dx / dist) * w.speed * dt * 60;
      w.y += (dy / dist) * w.speed * dt * 60;
      w.el.style.left = w.x + 'px';
      w.el.style.top = w.y + 'px';
      w.el.style.zIndex = Math.floor(w.y) + 10;
      w.el.style.transform = `scaleX(${dx < 0 ? -1 : 1})`;
    }
  });
}

/* =========================================================
   MINIMAP
   ========================================================= */
const mmInner = document.getElementById('mmInner');
const MM_SCALE = 190 / 6000;
function updateMinimapBuildings() {
  // Alte Dots entfernen, aber View behalten
  [...mmInner.querySelectorAll('.mm-dot')].forEach(d => d.remove());
  state.buildings.forEach(b => {
    const dot = document.createElement('div');
    dot.className = 'mm-dot';
    const def = BUILDINGS[b.type];
    const sz = def.size === 3 ? 5 : def.size === 2 ? 4 : 3;
    dot.style.width = sz + 'px'; dot.style.height = sz + 'px';
    dot.style.left = (b.x * MM_SCALE) + 'px';
    dot.style.top = (b.y * MM_SCALE) + 'px';
    dot.style.background = b.construction ? '#ffb300' :
      b.type === 'main' ? '#c9a84c' :
      def.category === 'military' ? '#b71c1c' :
      def.category === 'production' ? '#4caf50' :
      def.category === 'economy' ? '#ffb300' : '#8d6e63';
    mmInner.appendChild(dot);
  });
  let view = document.getElementById('mmView');
  if (!view) {
    view = document.createElement('div');
    view.className = 'mm-view';
    view.id = 'mmView';
    mmInner.appendChild(view);
  }
  updateMinimapView();
}
function updateMinimapView() {
  const view = document.getElementById('mmView');
  if (!view) return;
  const rect = mapEl.getBoundingClientRect();
  const vw = rect.width / state.zoom;
  const vh = rect.height / state.zoom;
  const vx = -state.camX / state.zoom;
  const vy = -state.camY / state.zoom;
  view.style.left = (vx * MM_SCALE) + 'px';
  view.style.top = (vy * MM_SCALE) + 'px';
  view.style.width = (vw * MM_SCALE) + 'px';
  view.style.height = (vh * MM_SCALE) + 'px';
}
mmInner.addEventListener('click', (e) => {
  const rect = mmInner.getBoundingClientRect();
  const wx = (e.clientX - rect.left) / MM_SCALE;
  const wy = (e.clientY - rect.top) / MM_SCALE;
  const mapRect = mapEl.getBoundingClientRect();
  state.camX = mapRect.width / 2 - wx * state.zoom;
  state.camY = mapRect.height / 2 - wy * state.zoom;
  applyTransform();
});

/* =========================================================
   OFFLINE-FORTSCHRITT
   ========================================================= */
function applyOfflineProgress() {
  const now = Date.now();
  const last = state.lastTick || now;
  const elapsed = Math.max(0, (now - last) / 1000);
  if (elapsed < 5) { state.lastTick = now; return; }

  // 1. Produktion nachholen (max. 8h)
  const effective = Math.min(elapsed, 8 * 3600);
  productionTick(effective);

  // 2. Baustellen: Zeit nachholen
  let finishedCount = 0;
  for (const b of state.buildings) {
    if (!b.construction) continue;
    const remain = b.constructionDuration - (now - b.constructionStart);
    if (remain <= 0) {
      b.construction = false;
      refreshBuildingEl(b);
      finishedCount++;
    } else {
      // Baustelle läuft weiter – Anzeige aktualisieren
      const progress = Math.min(1, (now - b.constructionStart) / b.constructionDuration);
      if (b._barFill) b._barFill.style.width = (progress * 100) + '%';
      if (b._badge) b._badge.textContent = Math.floor(progress * 100) + '%';
    }
  }
  if (finishedCount > 0) { recalc(); }

  // Banner anzeigen
  if (elapsed > 30) {
    const banner = document.getElementById('offlineBanner');
    const h = Math.floor(elapsed / 3600);
    const m = Math.floor((elapsed % 3600) / 60);
    const s = Math.floor(elapsed % 60);
    let timeStr = '';
    if (h > 0) timeStr += h + 'h ';
    if (m > 0) timeStr += m + 'm ';
    timeStr += s + 's';
    document.getElementById('obText').innerHTML = `Willkommen zurück!<small>Offline für ${timeStr} · Produktion wurde nachgeholt${finishedCount > 0 ? ' · ' + finishedCount + ' Gebäude fertig' : ''}</small>`;
    banner.classList.add('show');
  }
  state.lastTick = now;
}
document.getElementById('obClose').onclick = () => {
  document.getElementById('offlineBanner').classList.remove('show');
};

/* =========================================================
   START GAME
   ========================================================= */
function startGame() {
  buildTerrain();

  const loaded = tryLoadSave();
  if (!loaded) {
    const mainB = { id: state.nextId++, type: 'main', x: 3000 - 1.5*TILE, y: 3000 - 1.5*TILE, level: 1 };
    state.buildings.push(mainB);
    createBuildingEl(mainB);
    const house = { id: state.nextId++, type: 'house', x: 3000 + 2.5*TILE, y: 3000 - TILE, level: 1 };
    state.buildings.push(house);
    createBuildingEl(house);
    const farm = { id: state.nextId++, type: 'farm', x: 3000 - 6*TILE, y: 3000 - TILE, level: 1 };
    state.buildings.push(farm);
    createBuildingEl(farm);
  } else {
    // Offline-Fortschritt anwenden
    applyOfflineProgress();
  }

  recalc();
  updateUI();
  renderBuildingList();
  updateMinimapBuildings();
  centerCamera();

  // Game Loop
  let last = performance.now();
  let prodAccum = 0;
  let saveAccum = 0;
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    updateWorkers(dt);
    constructionTick();
    prodAccum += dt;
    if (prodAccum >= 1) {
      productionTick(prodAccum * state.speed);
      prodAccum = 0;
      updateUI();
    }
    saveAccum += dt;
    if (saveAccum >= 10) {
      state.lastTick = Date.now();
      saveGame(true);
      saveAccum = 0;
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  setInterval(checkLevel, 2000);
  setInterval(() => {
    // Detail-Panel Live-Update
    if (state.selected && state.selected.construction) {
      showDetailPanel(state.selected);
    }
  }, 500);

  notify("Willkommen in deinem Imperium!", false, true);
}

function checkLevel() {
  const totalLevels = state.buildings.filter(b => !b.construction).reduce((s, b) => s + b.level, 0);
  const newLevel = Math.max(1, Math.floor(totalLevels / 4) + 1);
  if (newLevel > state.level) {
    state.level = newLevel;
    updateUI();
    renderBuildingList();
    notify(`Imperium-Level ${newLevel} erreicht!`, false, true);
  }
}

function centerCamera() {
  const rect = mapEl.getBoundingClientRect();
  state.zoom = 1;
  state.camX = rect.width / 2 - 3000 * state.zoom;
  state.camY = rect.height / 2 - 3000 * state.zoom;
  applyTransform();
}

/* =========================================================
   SAVE / LOAD
   ========================================================= */
function saveGame(silent) {
  state.lastTick = Date.now();
  const save = { ...state };
  save.buildings = state.buildings.map(b => ({
    id: b.id, type: b.type, x: b.x, y: b.y, level: b.level,
    construction: b.construction || false,
    constructionStart: b.constructionStart || 0,
    constructionDuration: b.constructionDuration || 0,
    constructionTotal: b.constructionTotal || 0
  }));
  // selected, placing etc. nicht speichern
  delete save.selected;
  delete save.placing;
  localStorage.setItem('buildAnEmpireSave_v3', JSON.stringify(save));
  if (!silent) notify("Spiel gespeichert!", false, true);
}
function tryLoadSave() {
  const raw = localStorage.getItem('buildAnEmpireSave_v3');
  if (!raw) return false;
  try {
    const s = JSON.parse(raw);
    const saved = s.buildings || [];
    Object.assign(state, s);
    state.buildings = saved.map(b => {
      const nb = {
        id: b.id, type: b.type, x: b.x, y: b.y, level: b.level,
        construction: b.construction || false,
        constructionStart: b.constructionStart || 0,
        constructionDuration: b.constructionDuration || 0,
        constructionTotal: b.constructionTotal || 0
      };
      createBuildingEl(nb);
      return nb;
    });
    state.nextId = Math.max(...state.buildings.map(b => b.id), 0) + 1;
    return true;
  } catch(e) { console.warn(e); return false; }
}

/* =========================================================
   BUTTONS
   ========================================================= */
document.getElementById('btnZoomIn').onclick = () => { state.zoom = Math.min(2.6, state.zoom * 1.2); applyTransform(); };
document.getElementById('btnZoomOut').onclick = () => { state.zoom = Math.max(0.35, state.zoom / 1.2); applyTransform(); };
document.getElementById('btnCenter').onclick = centerCamera;
document.getElementById('btnSellMode').onclick = toggleSellMode;
document.getElementById('btnSpeed').onclick = () => {
  const speeds = [1, 2, 3];
  state.speed = speeds[(speeds.indexOf(state.speed) + 1) % speeds.length];
  document.getElementById('btnSpeed').textContent = '×' + state.speed;
  notify(`Geschwindigkeit: ×${state.speed}`);
};
document.getElementById('btnSave').onclick = () => saveGame(false);
document.getElementById('btnReset').onclick = () => {
  if (confirm("Wirklich alles zurücksetzen?")) {
    localStorage.removeItem('buildAnEmpireSave_v3');
    location.reload();
  }
};
document.getElementById('pbCancel').onclick = () => { cancelPlacing(); notify("Platzierung abgebrochen"); };

window.addEventListener('beforeunload', () => { saveGame(true); });
</script>
