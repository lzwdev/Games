<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Build an Empire</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #eef2f8; color: #1a2233;
  }

  /* ============ LOADING SCREEN ============ */
  #loader {
    position: fixed; inset: 0; z-index: 9999;
    background: radial-gradient(ellipse at 50% 40%, #ffffff 0%, #dbe6f5 60%, #c3d4ec 100%);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    transition: opacity 0.8s ease, visibility 0.8s;
    overflow: hidden;
  }
  #loader.hidden { opacity: 0; visibility: hidden; }

  .loader-bg-circle {
    position: absolute; border-radius: 50%;
    background: radial-gradient(circle, rgba(120,160,220,0.22), transparent 70%);
    animation: floatCircle 8s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes floatCircle {
    0%, 100% { transform: translate(0,0) scale(1); }
    50% { transform: translate(20px,-30px) scale(1.12); }
  }

  .loader-particles { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  .particle {
    position: absolute; border-radius: 50%;
    background: rgba(90,130,200,0.4);
    animation: rise linear infinite;
  }
  @keyframes rise {
    0% { transform: translateY(0) scale(0.6); opacity: 0; }
    20% { opacity: 0.9; }
    100% { transform: translateY(-120vh) scale(1.2); opacity: 0; }
  }

  .loader-emblem {
    position: relative; width: 110px; height: 110px; margin-bottom: 22px;
    animation: emblemIn 1s cubic-bezier(0.2,0.9,0.3,1.2);
  }
  @keyframes emblemIn {
    0% { transform: scale(0) rotate(-180deg); opacity: 0; }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }
  .loader-emblem svg { width: 100%; height: 100%; filter: drop-shadow(0 8px 24px rgba(60,110,190,0.35)); }
  .loader-emblem .ring {
    transform-origin: 55px 55px;
    animation: spinRing 12s linear infinite;
  }
  @keyframes spinRing { to { transform: rotate(360deg); } }

  .loader-title {
    position: relative; font-size: 62px; font-weight: 900;
    letter-spacing: 3px; text-transform: uppercase;
    color: #1e355e;
    text-align: center; line-height: 1.05;
    animation: titleIn 1s cubic-bezier(0.2,0.9,0.3,1.2) 0.2s both;
  }
  .loader-title .accent {
    background: linear-gradient(90deg, #2f6fd0, #5b9bf5, #2f6fd0);
    background-size: 200% 100%;
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shineText 3s linear infinite;
  }
  @keyframes shineText { to { background-position: 200% 50%; } }
  @keyframes titleIn {
    0% { transform: translateY(30px); opacity: 0; }
    100% { transform: translateY(0); opacity: 1; }
  }

  .loader-sub {
    margin-top: 12px; font-size: 14px; letter-spacing: 6px;
    color: #6b7d99; text-transform: uppercase; font-weight: 600;
    animation: fadeIn 1.4s ease-out 0.5s both;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .loader-bar-wrap {
    position: relative; margin-top: 44px;
    width: min(580px, 82vw); height: 12px;
    background: #d3dded;
    border-radius: 20px; overflow: hidden;
    box-shadow: inset 0 2px 6px rgba(40,70,120,0.18);
    animation: fadeIn 1s ease 0.7s both;
  }
  .loader-bar {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #2f6fd0, #6aa9f5, #9cc8ff, #6aa9f5, #2f6fd0);
    background-size: 200% 100%;
    border-radius: 20px;
    animation: shineBar 1.8s linear infinite;
    transition: width 0.35s ease;
    box-shadow: 0 0 14px rgba(70,130,220,0.6);
  }
  @keyframes shineBar { to { background-position: 200% 50%; } }

  .loader-status {
    margin-top: 16px; font-size: 13px; color: #5c7099;
    letter-spacing: 0.5px; height: 20px;
    display: flex; align-items: center; gap: 8px;
    animation: fadeIn 1s ease 0.9s both;
  }
  .loader-status .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: #2f6fd0; box-shadow: 0 0 8px #2f6fd0;
    animation: blink 1s ease-in-out infinite;
  }
  @keyframes blink { 0%,100%{opacity:0.3} 50%{opacity:1} }

  .loader-percent {
    margin-top: 6px; font-size: 12px; font-weight: 800;
    color: #2f6fd0; letter-spacing: 2px;
    animation: fadeIn 1s ease 0.9s both;
  }

  .loader-tips {
    position: absolute; bottom: 44px; left: 0; right: 0;
    text-align: center; font-size: 12px; color: #7b8dab;
    letter-spacing: 0.5px; animation: fadeIn 1.5s ease 1.2s both;
  }
  .loader-tips .tip { transition: opacity 0.5s; }

  /* ============ GAME ============ */
  #game { position: fixed; inset: 0; display: none; }
  #game.visible { display: block; }

  #map {
    position: absolute; inset: 0; overflow: hidden;
    cursor: grab;
    background: #cfe3b8;
  }
  #map.dragging { cursor: grabbing; }
  #map.placing { cursor: crosshair; }
  #map.selling { cursor: not-allowed; }

  #world {
    position: absolute; top: 0; left: 0;
    transform-origin: 0 0;
    width: 6000px; height: 6000px;
  }
  #grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(60,100,60,0.10) 1px, transparent 1px),
      linear-gradient(90deg, rgba(60,100,60,0.10) 1px, transparent 1px);
    background-size: 48px 48px;
  }
  .terrain-patch {
    position: absolute; border-radius: 50%;
    pointer-events: none;
  }
  .tree-deco, .rock-deco {
    position: absolute; pointer-events: none;
  }

  /* Buildings */
  .building {
    position: absolute; transform-origin: center bottom;
    display: flex; align-items: flex-end; justify-content: center;
    cursor: pointer; transition: filter 0.2s;
  }
  .building:hover { filter: brightness(1.12); }
  .building.selected { filter: brightness(1.18) drop-shadow(0 0 10px #2f6fd0); }
  .building svg { width: 100%; height: 100%; display: block; }
  .building.under-construction { opacity: 0.7; }

  /* Baustelle */
  .construction-overlay {
    position: absolute; inset: 0; pointer-events: none;
    display: flex; align-items: center; justify-content: center;
    z-index: 6;
  }
  .construction-overlay svg { width: 100%; height: 100%; }
  .progress-badge {
    position: absolute; top: -22px; left: 50%; transform: translateX(-50%);
    background: rgba(255,255,255,0.97); border: 1px solid #2f6fd0;
    color: #2f6fd0; font-size: 10px; font-weight: 800;
    padding: 2px 7px; border-radius: 8px;
    box-shadow: 0 2px 8px rgba(40,70,120,0.2);
    white-space: nowrap;
  }
  .progress-bar-bg {
    position: absolute; bottom: -12px; left: 10%; width: 80%; height: 5px;
    background: rgba(255,255,255,0.7); border-radius: 4px; overflow: hidden;
    border: 1px solid #bcd0ec;
  }
  .progress-bar-fill {
    height: 100%; background: linear-gradient(90deg, #2f6fd0, #6aa9f5);
    transition: width 0.3s linear;
  }

  /* Bauarbeiter */
  .builder {
    position: absolute; width: 20px; height: 26px;
    pointer-events: none; z-index: 8;
    animation: builderBob 0.5s ease-in-out infinite alternate;
  }
  @keyframes builderBob {
    0% { transform: translateY(0); }
    100% { transform: translateY(-2px); }
  }
  .builder svg { width: 100%; height: 100%; display: block; }
  .builder .hammer {
    transform-origin: 60% 80%;
    animation: hammerSwing 0.6s ease-in-out infinite;
  }
  @keyframes hammerSwing {
    0%, 100% { transform: rotate(-25deg); }
    50% { transform: rotate(30deg); }
  }

  .worker {
    position: absolute; width: 18px; height: 24px;
    pointer-events: none; transition: transform 0.1s linear;
    z-index: 5;
  }

  .float-text {
    position: absolute; font-weight: 800; font-size: 15px;
    pointer-events: none; z-index: 60; white-space: nowrap;
    text-shadow: 0 1px 3px rgba(255,255,255,0.9), 0 2px 6px rgba(0,0,0,0.25);
    animation: floatUp 1.4s ease-out forwards;
  }
  @keyframes floatUp {
    0% { transform: translateY(0); opacity: 1; }
    100% { transform: translateY(-55px); opacity: 0; }
  }

  /* ============ TOP BAR ============ */
  #topbar {
    position: absolute; top: 0; left: 0; right: 0; height: 58px;
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid #d3dded;
    display: flex; align-items: center; padding: 0 16px; gap: 18px;
    z-index: 50; box-shadow: 0 2px 14px rgba(40,70,120,0.10);
  }
  .logo-small {
    display: flex; align-items: center; gap: 8px;
    font-size: 16px; font-weight: 900; letter-spacing: 0.5px;
    color: #1e355e; white-space: nowrap;
  }
  .logo-small svg { width: 26px; height: 26px; }
  .logo-small .txt-accent {
    background: linear-gradient(90deg,#2f6fd0,#5b9bf5);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .res-group { display: flex; gap: 8px; flex: 1; overflow-x: auto; padding: 4px 0; }
  .res-group::-webkit-scrollbar { height: 5px; }
  .res-group::-webkit-scrollbar-thumb { background: #c3d4ec; border-radius: 3px; }
  .res {
    display: flex; align-items: center; gap: 6px;
    font-size: 12.5px; font-weight: 700; white-space: nowrap;
    background: #f2f6fc; padding: 6px 11px; border-radius: 9px;
    border: 1px solid #e0e8f4; color: #26344e;
    transition: all 0.2s;
  }
  .res:hover { background: #e8f0fc; border-color: #bcd0ec; }
  .res svg { width: 15px; height: 15px; flex-shrink: 0; }
  .res .val { color: #1e355e; }

  /* ============ RIGHT PANEL ============ */
  #rightPanel {
    position: absolute; top: 58px; right: 0; bottom: 0; width: 330px;
    background: rgba(255,255,255,0.96);
    backdrop-filter: blur(14px);
    border-left: 1px solid #d3dded;
    z-index: 40; display: flex; flex-direction: column;
    box-shadow: -4px 0 20px rgba(40,70,120,0.08);
  }
  .panel-head {
    padding: 12px 16px; font-size: 11.5px; letter-spacing: 1.8px;
    text-transform: uppercase; color: #2f6fd0; font-weight: 800;
    border-bottom: 1px solid #e0e8f4;
    display: flex; justify-content: space-between; align-items: center;
  }
  .panel-head .count {
    background: #e6efff; color: #2f6fd0;
    padding: 2px 8px; border-radius: 10px; font-size: 11px;
  }
  .panel-tabs {
    display: flex; gap: 4px; padding: 8px 10px 0; flex-wrap: wrap;
  }
  .tab-btn {
    flex: 1; min-width: 60px; padding: 7px 6px; font-size: 11px; font-weight: 700;
    background: transparent; border: none; cursor: pointer;
    border-radius: 7px 7px 0 0; color: #6b7d99;
    transition: all 0.15s;
  }
  .tab-btn:hover { background: #eef4fd; color: #2f6fd0; }
  .tab-btn.active { background: #e6efff; color: #2f6fd0; }
  #buildingList { flex: 1; overflow-y: auto; padding: 10px; }
  #buildingList::-webkit-scrollbar { width: 8px; }
  #buildingList::-webkit-scrollbar-thumb { background: #c3d4ec; border-radius: 4px; }

  .bcard {
    display: flex; gap: 10px; padding: 10px;
    background: #f7faff;
    border: 1px solid #e0e8f4;
    border-radius: 10px; margin-bottom: 7px;
    cursor: pointer; transition: all 0.18s;
  }
  .bcard:hover { background: #eaf2ff; border-color: #a8c8f0; transform: translateX(-3px); box-shadow: 0 3px 12px rgba(47,111,208,0.12); }
  .bcard.locked { opacity: 0.45; cursor: not-allowed; }
  .bcard.locked:hover { transform: none; background: #f7faff; border-color: #e0e8f4; box-shadow: none; }
  .bcard.active { background: #dbeafe; border-color: #2f6fd0; box-shadow: 0 0 0 2px rgba(47,111,208,0.2); }
  .bcard .icon {
    width: 48px; height: 48px; border-radius: 9px;
    background: #eaf2ff; display: flex;
    align-items: center; justify-content: center;
    flex-shrink: 0; border: 1px solid #d5e2f5;
  }
  .bcard .icon svg { width: 30px; height: 30px; }
  .bcard .info { flex: 1; min-width: 0; }
  .bcard .name { font-size: 13px; font-weight: 700; margin-bottom: 2px; color: #1e355e; }
  .bcard .name .lock { color: #c9532f; font-size: 10px; font-weight: 700; margin-left: 4px; }
  .bcard .desc { font-size: 11px; color: #6b7d99; line-height: 1.3; }
  .bcard .cost { font-size: 11px; color: #2f6fd0; margin-top: 4px; font-weight: 800; }
  .bcard .cost .time { color: #8d6e63; font-weight: 700; }

  /* ============ DETAIL PANEL (rechts oben fixiert) ============ */
  #detailPanel {
    position: absolute; top: 74px; right: 346px; z-index: 60;
    width: 290px; max-height: calc(100vh - 150px);
    background: #ffffff;
    border: 1px solid #bcd0ec;
    border-radius: 14px;
    box-shadow: 0 12px 40px rgba(40,70,120,0.25);
    display: none;
    flex-direction: column;
    overflow: hidden;
    animation: detailIn 0.25s cubic-bezier(0.2,0.9,0.3,1.2);
  }
  #detailPanel.show { display: flex; }
  @keyframes detailIn {
    0% { transform: translateX(20px) scale(0.96); opacity: 0; }
    100% { transform: translateX(0) scale(1); opacity: 1; }
  }
  .dp-head {
    padding: 12px 14px;
    background: linear-gradient(135deg, #eaf2ff, #f7faff);
    border-bottom: 1px solid #d5e2f5;
    display: flex; align-items: center; gap: 10px;
  }
  .dp-head .dp-icon {
    width: 42px; height: 42px; border-radius: 10px;
    background: #fff; display: flex; align-items: center; justify-content: center;
    border: 1px solid #d5e2f5; flex-shrink: 0;
  }
  .dp-head .dp-icon svg { width: 28px; height: 28px; }
  .dp-head .dp-titles { flex: 1; min-width: 0; }
  .dp-head .dp-name { font-size: 14px; font-weight: 800; color: #1e355e; }
  .dp-head .dp-level { font-size: 11px; color: #6b7d99; font-weight: 700; margin-top: 2px; }
  .dp-close {
    background: transparent; border: none; cursor: pointer;
    font-size: 20px; color: #8fa3c8; line-height: 1;
    padding: 2px 4px; border-radius: 6px;
  }
  .dp-close:hover { background: #e0e8f4; color: #c9532f; }

  .dp-body { padding: 12px 14px; overflow-y: auto; flex: 1; }
  .dp-body::-webkit-scrollbar { width: 6px; }
  .dp-body::-webkit-scrollbar-thumb { background: #c3d4ec; border-radius: 3px; }
  .dp-desc { font-size: 12px; color: #4a5c78; line-height: 1.5; margin-bottom: 10px; }
  .dp-stat {
    display: flex; justify-content: space-between; padding: 5px 0;
    border-bottom: 1px dashed #e0e8f4; font-size: 12px;
  }
  .dp-stat .k { color: #6b7d99; }
  .dp-stat .v { color: #1e355e; font-weight: 700; }
  .dp-stat .v.good { color: #2e7d32; }
  .dp-upgrade-box {
    margin-top: 12px; padding: 10px; border-radius: 10px;
    background: #f7faff; border: 1px solid #e0e8f4;
  }
  .dp-upgrade-box .dp-up-title {
    font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
    color: #2f6fd0; font-weight: 800; margin-bottom: 8px;
  }
  .dp-up-row {
    display: flex; justify-content: space-between;
    font-size: 12px; padding: 3px 0; color: #4a5c78;
  }
  .dp-up-row .v { font-weight: 700; color: #1e355e; }
  .dp-up-row .v.cost { color: #2f6fd0; }
  .dp-up-row .v.time { color: #8d6e63; }
  .dp-preview {
    display: flex; gap: 8px; align-items: center; justify-content: center;
    margin: 10px 0 4px;
  }
  .dp-preview .prev {
    width: 68px; height: 68px; display: flex; align-items: center; justify-content: center;
    background: #fff; border-radius: 10px; border: 1px solid #e0e8f4;
  }
  .dp-preview .prev svg { width: 100%; height: 100%; }
  .dp-preview .prev.future { border-color: #2f6fd0; box-shadow: 0 0 0 2px rgba(47,111,208,0.15); }
  .dp-preview .arrow { color: #2f6fd0; font-size: 18px; font-weight: 900; }
  .dp-actions { padding: 12px 14px; border-top: 1px solid #e0e8f4; display: flex; gap: 8px; }
  .dp-actions .btn { flex: 1; justify-content: center; }

  /* Baufortschritt im Detail-Panel */
  .dp-progress-box {
    margin-top: 10px; padding: 10px; border-radius: 10px;
    background: #fff8e1; border: 1px solid #ffe082;
  }
  .dp-progress-box .lbl { font-size: 11px; color: #8d6e63; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 6px; }
  .dp-progress-bar { height: 8px; background: #fff; border-radius: 4px; overflow: hidden; border: 1px solid #ffe082; }
  .dp-progress-fill { height: 100%; background: linear-gradient(90deg, #ffb300, #ffd54f); transition: width 0.4s linear; }
  .dp-progress-time { font-size: 11px; color: #8d6e63; margin-top: 5px; text-align: right; font-weight: 700; }

  /* ============ BOTTOM BAR ============ */
  #bottombar {
    position: absolute; bottom: 0; left: 0; right: 330px; height: 52px;
    background: rgba(255,255,255,0.94);
    backdrop-filter: blur(14px);
    border-top: 1px solid #d3dded;
    display: flex; align-items: center; padding: 0 12px; gap: 8px;
    z-index: 45;
  }
  .btn {
    background: #f2f6fc;
    border: 1px solid #d3dded;
    color: #26344e; padding: 7px 13px; border-radius: 8px;
    font-size: 12px; font-weight: 700; cursor: pointer;
    transition: all 0.15s; white-space: nowrap;
    display: inline-flex; align-items: center; gap: 5px;
  }
  .btn:hover { background: #e6efff; border-color: #a8c8f0; color: #2f6fd0; }
  .btn:active { transform: scale(0.96); }
  .btn.active { background: #2f6fd0; border-color: #2f6fd0; color: #fff; }
  .btn svg { width: 14px; height: 14px; }
  .spacer { flex: 1; }
  .hint { font-size: 11px; color: #7b8dab; white-space: nowrap; }

  /* Platzierungs-Banner */
  #placeBanner {
    position: absolute; top: 74px; left: 50%; transform: translateX(-50%);
    z-index: 70; background: #ffffff;
    border: 1px solid #2f6fd0; border-radius: 12px;
    padding: 10px 18px; box-shadow: 0 8px 24px rgba(40,70,120,0.2);
    display: none; align-items: center; gap: 14px;
    animation: detailIn 0.3s cubic-bezier(0.2,0.9,0.3,1.2);
  }
  #placeBanner.show { display: flex; }
  #placeBanner .pb-icon { width: 34px; height: 34px; }
  #placeBanner .pb-icon svg { width: 100%; height: 100%; }
  #placeBanner .pb-text { font-size: 13px; font-weight: 700; color: #1e355e; }
  #placeBanner .pb-text small { display: block; font-size: 11px; color: #6b7d99; font-weight: 500; margin-top: 2px; }
  #placeBanner .pb-key {
    background: #e6efff; color: #2f6fd0; padding: 3px 8px; border-radius: 6px;
    font-size: 11px; font-weight: 800; border: 1px solid #bcd0ec;
    font-family: monospace;
  }
  #placeBanner .pb-cancel {
    background: #ffeaea; color: #c9532f; padding: 5px 10px;
    border-radius: 7px; font-size: 11px; font-weight: 800;
    border: 1px solid #f2b8b8; cursor: pointer;
  }
  #placeBanner .pb-cancel:hover { background: #ffd5d5; }

  /* ============ TOOLTIP ============ */
  #tooltip {
    position: absolute; z-index: 80; pointer-events: none;
    background: #ffffff; border: 1px solid #bcd0ec;
    border-radius: 10px; padding: 10px 13px; font-size: 12px;
    box-shadow: 0 8px 30px rgba(40,70,120,0.22); display: none;
    max-width: 250px; color: #26344e;
  }
  #tooltip .t-title { font-weight: 800; color: #1e355e; margin-bottom: 4px; font-size: 13px; }
  #tooltip .t-row { color: #4a5c78; margin: 2px 0; }

  #placeGhost {
    position: absolute; pointer-events: none; z-index: 30;
    opacity: 0.55; border: 2px dashed #2f6fd0; border-radius: 8px;
    display: none; background: rgba(47,111,208,0.12);
  }
  #placeGhost.invalid { border-color: #e53935; background: rgba(229,57,53,0.12); }

  /* Modal (für Reset-Bestätigung) */
  #modal {
    position: absolute; inset: 0; z-index: 100;
    background: rgba(30,53,94,0.35); backdrop-filter: blur(4px);
    display: none; align-items: center; justify-content: center;
  }
  #modal.show { display: flex; }
  .modal-box {
    background: #ffffff; border: 1px solid #d3dded;
    border-radius: 16px; padding: 24px 26px; width: min(420px, 90vw);
    box-shadow: 0 20px 70px rgba(40,70,120,0.3);
    animation: popIn 0.25s ease; color: #26344e;
  }
  @keyframes popIn { from { transform: scale(0.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .modal-box h3 { color: #1e355e; margin-bottom: 10px; font-size: 19px; }
  .modal-box p { font-size: 13px; color: #4a5c78; margin: 6px 0; line-height: 1.5; }
  .modal-actions { display: flex; gap: 10px; margin-top: 18px; }
  .modal-actions .btn { flex: 1; padding: 10px; justify-content: center; }
  .btn-primary { background: #2f6fd0; border-color: #2f6fd0; color: #fff; }

const bar = document.getElementById('bar');
const statusText = document.getElementById('statusText');
const percentEl = document.getElementById('percent');
const loader = document.getElementById('loader');
const tipText = document.getElementById('tipText');

const particlesWrap = document.getElementById('particles');
for (let i = 0; i < 40; i++) {
  const p = document.createElement('div');
  p.className = 'particle';
  p.style.left = Math.random() * 100 + '%';
  p.style.bottom = '-10px';
  p.style.width = (2 + Math.random()*4) + 'px';
  p.style.height = p.style.width;
  p.style.animationDuration = (5 + Math.random()*8) + 's';
  p.style.animationDelay = (Math.random()*6) + 's';
  p.style.opacity = 0.2 + Math.random()*0.5;
  particlesWrap.appendChild(p);
}
let tipIndex = 0;
setInterval(() => {
  tipIndex = (tipIndex + 1) % tips.length;
  tipText.style.opacity = 0;
  setTimeout(() => { tipText.textContent = tips[tipIndex]; tipText.style.opacity = 1; }, 400);
}, 2600);

let loadProgress = 0, loadDone = false;
const loadInterval = setInterval(() => {
  if (loadDone) return;
  const step = loadProgress < 70 ? (2 + Math.random() * 4) : (0.8 + Math.random() * 2);
  loadProgress = Math.min(100, loadProgress + step);
  if (loadProgress > 15 && loadProgress < 30) statusText.textContent = statuses[2];
  else if (loadProgress < 45) statusText.textContent = statuses[3];
  else if (loadProgress < 60) statusText.textContent = statuses[4];
  else if (loadProgress < 72) statusText.textContent = statuses[5];
  else if (loadProgress < 84) statusText.textContent = statuses[6];
  else if (loadProgress < 94) statusText.textContent = statuses[7];
  else statusText.textContent = statuses[9];
  bar.style.width = loadProgress + '%';
  percentEl.textContent = Math.floor(loadProgress) + '%';
  if (loadProgress >= 100) {
    loadDone = true;
    clearInterval(loadInterval);
    statusText.textContent = "Server erreichbar ✓  ·  Starte Imperium…";
    setTimeout(() => {
      loader.classList.add('hidden');
      document.getElementById('game').classList.add('visible');
      startGame();
    }, 700);
  }
}, 90);

/* ---------- TERRAIN ---------- */
const world = document.getElementById('world');
function buildTerrain() {
  const colors = ['#b8d99a', '#a8cd88', '#c6e0a8', '#9fc47f', '#b0d490'];
  for (let i = 0; i < 240; i++) {
    const p = document.createElement('div');
    p.className = 'terrain-patch';
    const sz = 90 + Math.random() * 340;
    p.style.width = sz + 'px'; p.style.height = sz + 'px';
    p.style.left = Math.random() * 6000 + 'px';
    p.style.top = Math.random() * 6000 + 'px';
    p.style.background = colors[Math.floor(Math.random()*colors.length)];
    p.style.opacity = 0.18 + Math.random()*0.25;
    world.appendChild(p);
  }
  for (let i = 0; i < 120; i++) {
    const t = document.createElement('div');
    t.className = 'tree-deco';
    t.innerHTML = `<svg viewBox="0 0 30 40" width="26" height="34"><rect x="13" y="26" width="4" height="12" fill="#6d4c41"/><circle cx="15" cy="18" r="11" fill="#4caf50"/><circle cx="9" cy="22" r="7" fill="#66bb6a"/><circle cx="21" cy="22" r="7" fill="#388e3c"/></svg>`;
    t.style.left = Math.random() * 6000 + 'px';
    t.style.top = Math.random() * 6000 + 'px';
    t.style.opacity = 0.85;
    world.appendChild(t);
  }
  for (let i = 0; i < 50; i++) {
    const r = document.createElement('div');
    r.className = 'rock-deco';
    r.innerHTML = `<svg viewBox="0 0 30 24" width="24" height="20"><path d="M2 22 L6 10 L14 14 L20 6 L28 22 Z" fill="#b0bec5" stroke="#607d8b" stroke-width="1.2"/></svg>`;
    r.style.left = Math.random() * 6000 + 'px';
    r.style.top = Math.random() * 6000 + 'px';
    r.style.opacity = 0.7;
    world.appendChild(r);
  }
}

/* =========================================================
   KORREKTE SVG BUILDING RENDERER
   Wichtig: Tür IMMER auf Bodenlinie (y=100), Fenster über Boden,
   nicht in Körpermitte oder außerhalb des Daches.
   ========================================================= */
function buildingSVG(type, level, w, h) {
  const lvl = level;

  if (type === 'main') {
    const bodyTop = 100 - (30 + lvl * 4);
    const bodyH = 100 - bodyTop;
    let roof = '';
    if (lvl >= 2) roof += `<polygon points="14,${bodyTop} 50,${bodyTop-20} 86,${bodyTop}" fill="#8d3b2a" stroke="#3a2f10" stroke-width="1.6"/>`;
    let centralTower = '';
    if (lvl >= 3) centralTower = `<rect x="42" y="${bodyTop-28}" width="16" height="20" fill="#c9a84c" stroke="#7a5c10" stroke-width="1.4"/><polygon points="40,${bodyTop-28} 50,${bodyTop-40} 60,${bodyTop-28}" fill="#8d3b2a" stroke="#5a1a1a" stroke-width="1.2"/>`;
    let sideTowers = '';
    if (lvl >= 4) sideTowers += `<rect x="18" y="${bodyTop-12}" width="10" height="12" fill="#b8860b" stroke="#7a5c10" stroke-width="1"/><rect x="72" y="${bodyTop-12}" width="10" height="12" fill="#b8860b" stroke="#7a5c10" stroke-width="1"/>`;
    let orb = '';
    if (lvl >= 5) orb = `<circle cx="50" cy="${bodyTop-46}" r="3" fill="#ffd66b" stroke="#c99a00" stroke-width="1"/>`;
    let gateHouse = '';
    if (lvl >= 6) gateHouse = `<rect x="30" y="${bodyTop-18}" width="6" height="18" fill="#8d6e63"/><rect x="64" y="${bodyTop-18}" width="6" height="18" fill="#8d6e63"/>`;
    let flags = '';
    if (lvl >= 7) flags = `<rect x="49" y="${bodyTop-58}" width="2" height="12" fill="#555"/><polygon points="51,${bodyTop-58} 62,${bodyTop-54} 51,${bodyTop-50}" fill="#b71c1c"/>`;
    let windowsTop = '';
    if (lvl >= 8) windowsTop = `<circle cx="30" cy="${bodyTop-24}" r="3" fill="#90caf9" stroke="#2f6fd0" stroke-width="0.8"/><circle cx="70" cy="${bodyTop-24}" r="3" fill="#90caf9" stroke="#2f6fd0" stroke-width="0.8"/>`;
    let goldRoof = '';
    if (lvl >= 9) goldRoof = `<rect x="36" y="${bodyTop-40}" width="28" height="6" fill="#ffd54f" stroke="#c99a00" stroke-width="1"/>`;
    let crown = '';
    if (lvl >= 10) crown = `<circle cx="50" cy="${bodyTop-70}" r="5" fill="#ffd54f" stroke="#c99a00" stroke-width="1.2"/><rect x="49" y="${bodyTop-65}" width="2" height="10" fill="#555"/>`;

    // Fenster: immer in der Körpermitte, oberhalb der Tür, innerhalb des Körpers
    const winY = bodyTop + 8;
    const winCount = lvl >= 5 ? 4 : 2;
    let windows = '';
    const startX = winCount === 4 ? 16 : 24;
    const stepX = winCount === 4 ? 16 : 30;
    for (let i = 0; i < winCount; i++) {
      const wx = startX + i * stepX;
      // Nur zeichnen, wenn innerhalb Körperbreite
      if (wx > 12 && wx < 84) {
        windows += `<rect x="${wx}" y="${winY}" width="8" height="10" fill="#ffe08a" stroke="#7a5c10" stroke-width="0.8"/>`;
      }
    }

    return `<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMax meet">
      <ellipse cx="50" cy="97" rx="42" ry="3" fill="rgba(0,0,0,0.18)"/>
      <rect x="18" y="${bodyTop}" width="64" height="${bodyH}" rx="2" fill="#c9a84c" stroke="#7a5c10" stroke-width="1.8"/>
      ${roof}
      ${centralTower}
      ${sideTowers}
      ${orb}
      ${gateHouse}
      ${flags}
      ${windowsTop}
      ${goldRoof}
      ${crown}
      ${windows}
      <rect x="44" y="80" width="12" height="20" fill="#4a2f10"/>
      <circle cx="54" cy="90" r="1" fill="#ffd54f"/>
    </svg>`;
  }

  if (type === 'house') {
    // Körper endet bei y=100 (Boden). Dach sitzt oben drauf.
    const bodyH = 26 + lvl * 3.5;
    const bodyTop = 100 - bodyH;
    const roofH = 14 + lvl * 1.6;

    // Fenster: horizontal über Boden, aber vertikal mittig im Körper
    // Wichtig: nicht zu hoch (nicht ins Dach), nicht zu tief (nicht in Tür)
    const winY = bodyTop + bodyH * 0.35;
    const winH = 8;
    const winW = 9;

    let windows = '';
    // Linkes Fenster
    windows += `<rect x="20" y="${winY}" width="${winW}" height="${winH}" fill="#ffe08a" stroke="#7a5c10" stroke-width="0.8"/>`;
    // Rechtes Fenster (ab Lv.2 zusätzlich, davor nur eins mittig)
    if (lvl >= 2) {
      windows += `<rect x="${100-20-winW}" y="${winY}" width="${winW}" height="${winH}" fill="#ffe08a" stroke="#7a5c10" stroke-width="0.8"/>`;
    } else {
      windows += `<rect x="${50-winW/2}" y="${winY}" width="${winW}" height="${winH}" fill="#ffe08a" stroke="#7a5c10" stroke-width="0.8"/>`;
    }

    let extras = '';
    // Schornstein: sitzt auf dem Dach, nicht am Körper
    if (lvl >= 3) {
      const chimY = bodyTop - roofH + 4;
      extras += `<rect x="46" y="${chimY}" width="8" height="12" fill="#8d6e63" stroke="#4e342e" stroke-width="1"/>`;
    }
    // Dachfenster: im Dach, mittig
    if (lvl >= 4) {
      const dfY = bodyTop - roofH * 0.55;
      extras += `<rect x="44" y="${dfY}" width="12" height="7" fill="#4fc3f7" stroke="#01579b" stroke-width="0.8"/>`;
    }
    // Zweiter Schornstein (Lv.5)
    if (lvl >= 5) {
      const chimY2 = bodyTop - roofH + 4;
      extras += `<rect x="26" y="${chimY2}" width="6" height="10" fill="#8d6e63" stroke="#4e342e" stroke-width="0.9"/>`;
    }
    // Vordach über Tür
    if (lvl >= 6) {
      extras += `<path d="M38 74 L62 74 L58 68 L42 68 Z" fill="#8d6e63" stroke="#4e342e" stroke-width="1"/>`;
    }
    // Goldene Zierleiste
    if (lvl >= 7) {
      extras += `<rect x="30" y="${bodyTop - roofH*0.25}" width="40" height="3" fill="#c9a84c" stroke="#7a5c10" stroke-width="0.8"/>`;
    }
    // Fahne
    if (lvl >= 8) {
      extras += `<rect x="49" y="${bodyTop - roofH - 10}" width="2" height="12" fill="#555"/><polygon points="51,${bodyTop - roofH - 10} 60,${bodyTop - roofH - 6} 51,${bodyTop - roofH - 2}" fill="#b71c1c"/>`;
    }
    // Seitliche Anbauten
    if (lvl >= 9) {
      extras += `<rect x="6" y="${bodyTop + 8}" width="8" height="${bodyH - 8}" fill="#a1887f" stroke="#4e342e" stroke-width="1"/><rect x="86" y="${bodyTop + 8}" width="8" height="${bodyH - 8}" fill="#a1887f" stroke="#4e342e" stroke-width="1"/>`;
    }
    // Goldene Kugel
    if (lvl >= 10) {
      extras += `<circle cx="50" cy="${bodyTop - roofH - 16}" r="3" fill="#ffd54f" stroke="#c99a00" stroke-width="1"/>`;
    }

    // Tür: exakt auf Bodenlinie y=100, mittig
    const doorW = 12, doorH = 22;
    const doorX = 50 - doorW/2;
    const doorY = 100 - doorH;

    return `<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMax meet">
      <ellipse cx="50" cy="97" rx="40" ry="3" fill="rgba(0,0,0,0.16)"/>
      <rect x="14" y="${bodyTop}" width="72" height="${bodyH}" fill="#d98e5a" stroke="#7a3b1a" stroke-width="1.6"/>
      <polygon points="8,${bodyTop} 50,${bodyTop - roofH} 92,${bodyTop}" fill="#a83232" stroke="#5a1a1a" stroke-width="1.6" stroke-linejoin="round"/>
      ${windows}
      ${extras}
      <rect x="${doorX}" y="${doorY}" width="${doorW}" height="${doorH}" fill="#4a2f10" stroke="#2a1a08" stroke-width="0.8"/>
      <circle cx="${doorX + doorW - 3}" cy="${doorY + doorH/2}" r="1" fill="#ffd54f"/>
    </svg>`;
  }

  if (type === 'farm') {
    if (lvl >= 5) {
      const bodyTop = 100 - (20 + lvl * 2);
      const bodyH = 100 - bodyTop;
      let chim = '';
      const chimCount = Math.min(3, Math.floor(lvl/2));
      for (let i = 0; i < chimCount; i++) {
        const cxp = 24 + i * 26;
        const chH = 16 + i * 3 + lvl;
        chim += `<rect x="${cxp}" y="${bodyTop - chH}" width="6" height="${chH}" fill="#37474f" stroke="#1c262b" stroke-width="1"/>`;
      }
      let smoke = '';
      if (lvl >= 6) smoke = `<circle cx="26" cy="${bodyTop - 20}" r="4" fill="#cfd8dc" opacity="0.7"/><circle cx="50" cy="${bodyTop - 26}" r="5" fill="#cfd8dc" opacity="0.6"/>`;
      // Fenster horizontal mittig im Körper
      const winY = bodyTop + bodyH * 0.35;
      let windows = '';
      for (let i = 0; i < 5; i++) {
        windows += `<rect x="${12 + i*15}" y="${winY}" width="9" height="9" fill="#90caf9" stroke="#37474f" stroke-width="0.6"/>`;
      }
      return `<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMax meet">
        <ellipse cx="50" cy="97" rx="44" ry="3" fill="rgba(0,0,0,0.2)"/>
        <rect x="6" y="${bodyTop}" width="88" height="${bodyH}" fill="#546e7a" stroke="#2e3b42" stroke-width="1.6"/>
        ${windows}
        ${chim}
        ${smoke}
        <rect x="42" y="82" width="16" height="18" fill="#263238"/>
      </svg>`;
    }
    const rows = 2 + Math.min(lvl, 6);
    const fieldH = 26;
    const fieldTop = 100 - fieldH;
    let fieldRows = '';
    for (let i = 0; i < rows; i++) {
      const yy = fieldTop + i * (fieldH/rows);
      fieldRows += `<rect x="8" y="${yy}" width="84" height="${(fieldH/rows)*0.55}" fill="${i%2?'#8bc34a':'#cddc39'}" stroke="#558b2f" stroke-width="0.5"/>`;
    }
    // Bauernhaus hat Körper bei y=42..74 (also 32 hoch, über Feld)
    const houseTop = 42, houseH = 32;
    // Fenster im Bauernhaus mittig
    let hw = '';
    if (lvl >= 2) hw = `<rect x="64" y="${houseTop + houseH*0.45}" width="6" height="6" fill="#ffe08a" stroke="#7a5c10" stroke-width="0.6"/>`;
    // Tür auf Feldboden
    return `<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMax meet">
      <ellipse cx="50" cy="97" rx="42" ry="3" fill="rgba(0,0,0,0.15)"/>
      <rect x="4" y="${fieldTop}" width="92" height="${fieldH}" fill="#6b8e23" stroke="#558b2f" stroke-width="1.2" rx="2"/>
      ${fieldRows}
      <rect x="58" y="${houseTop}" width="28" height="${houseH}" fill="#a1887f" stroke="#5d4037" stroke-width="1.4"/>
      <polygon points="54,${houseTop} 72,${houseTop - 14} 90,${houseTop}" fill="#8d3b2a" stroke="#5a1a1a" stroke-width="1.3"/>
      <rect x="68" y="${100 - 14}" width="8" height="14" fill="#4a2f10"/>
      ${hw}
    </svg>`;
  }

  if (type === 'lumber') {
    const bodyH = 26 + lvl * 2.4;
    const bodyTop = 100 - bodyH;
    const roofH = 14;
    // Fenster mittig im Körper
    const winY = bodyTop + bodyH * 0.4;
    let windows = '';
    if (lvl >= 2) windows += `<rect x="20" y="${winY}" width="9" height="9" fill="#ffe08a" stroke="#7a5c10" stroke-width="0.8"/>`;
    if (lvl >= 3) windows += `<rect x="71" y="${winY}" width="9" height="9" fill="#ffe08a" stroke="#7a5c10" stroke-width="0.8"/>`;
    let extras = '';
    if (lvl >= 4) extras += `<rect x="46" y="${bodyTop - roofH + 2}" width="8" height="10" fill="#8d6e63" stroke="#4e342e" stroke-width="0.9"/>`;
    if (lvl >= 5) extras += `<circle cx="22" cy="${100 - 8}" r="4" fill="#8d6e63" stroke="#4e342e" stroke-width="1"/><circle cx="78" cy="${100 - 8}" r="4" fill="#8d6e63" stroke="#4e342e" stroke-width="1"/>`;
    if (lvl >= 6) extras += `<rect x="10" y="86" width="80" height="3" fill="#a1887f"/>`;
    if (lvl >= 7) extras += `<rect x="42" y="${bodyTop - roofH - 12}" width="16" height="8" fill="#c9a84c" stroke="#7a5c10" stroke-width="0.8"/>`;
    if (lvl >= 8) extras += `<circle cx="50" cy="${bodyTop - roofH - 18}" r="3" fill="#ffd54f"/>`;
    // Tür auf Bodenlinie
    return `<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMax meet">
      <ellipse cx="50" cy="97" rx="38" ry="3" fill="rgba(0,0,0,0.16)"/>
      <rect x="16" y="${bodyTop}" width="68" height="${bodyH}" fill="#795548" stroke="#4e342e" stroke-width="1.6"/>
      <polygon points="12,${bodyTop} 50,${bodyTop - roofH} 88,${bodyTop}" fill="#5d4037" stroke="#3e2723" stroke-width="1.6" stroke-linejoin="round"/>
      ${windows}
      ${extras}
      <rect x="44" y="78" width="12" height="22" fill="#3e2723"/>
      <circle cx="53" cy="89" r="1" fill="#ffd54f"/>
    </svg>`;
  }

  if (type === 'quarry') {
    const rockCount = 3 + Math.min(lvl, 7);
    let rocks = '';
    for (let i = 0; i < rockCount; i++) {
      const rx = 8 + (i * 84/rockCount) + Math.random()*2;
      const ry = 88 + Math.random()*6;
      const rr = 4 + Math.random()*3;
      rocks += `<ellipse cx="${rx}" cy="${ry}" rx="${rr}" ry="${rr*0.75}" fill="#bdbdbd" stroke="#616161" stroke-width="0.8"/>`;
    }
    let extras = '';
    if (lvl >= 2) extras += `<rect x="40" y="52" width="20" height="20" fill="#757575" stroke="#424242" stroke-width="1"/>`;
    if (lvl >= 3) extras += `<polygon points="40,52 50,42 60,52" fill="#8d6e63"/>`;
    if (lvl >= 5) extras += `<rect x="44" y="58" width="6" height="8" fill="#ffe08a"/>`;
    if (lvl >= 6) extras += `<circle cx="50" cy="46" r="3" fill="#ffd54f"/>`;
    if (lvl >= 7) extras += `<rect x="18" y="60" width="4" height="20" fill="#616161"/><rect x="78" y="60" width="4" height="20" fill="#616161"/>`;
    if (lvl >= 8) extras += `<polygon points="12,88 20,78 28,88" fill="#9e9e9e" stroke="#616161" stroke-width="1"/>`;
    if (lvl >= 9) extras += `<rect x="44" y="28" width="12" height="14" fill="#8d6e63" stroke="#4e342e" stroke-width="1"/>`;
    if (lvl >= 10) extras += `<circle cx="50" cy="22" r="3" fill="#ffd54f"/>`;
    // Tür in Hauptgestein, auf Bodenlinie
    return `<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMax meet">
      <ellipse cx="50" cy="97" rx="44" ry="3" fill="rgba(0,0,0,0.18)"/>
      <path d="M4 92 L18 46 L38 58 L54 40 L72 52 L88 44 L96 92 Z" fill="#b0bec5" stroke="#546e7a" stroke-width="1.4" stroke-linejoin="round"/>
      <rect x="42" y="70" width="14" height="22" fill="#3e2723"/>
      ${rocks}
      ${extras}
    </svg>`;
  }

  if (type === 'market') {
    const stalls = 1 + Math.min(lvl, 4);
    let stallSvg = '';
    const stallW = 74 / stalls;
    for (let i = 0; i < stalls; i++) {
      const x = 12 + i * stallW;
      stallSvg += `<rect x="${x}" y="52" width="${stallW - 2}" height="34" fill="#ffb74d" stroke="#e65100" stroke-width="1.2"/>
                   <polygon points="${x-1},52 ${x + (stallW-2)/2},40 ${x + stallW - 1},52" fill="${i%2?'#e53935':'#43a047'}" stroke="#7f1d1d" stroke-width="0.8"/>`;
    }
    let extras = '';
    if (lvl >= 3) extras += `<rect x="46" y="26" width="8" height="18" fill="#8d6e63"/>`;
    if (lvl >= 5) extras += `<circle cx="50" cy="22" r="4" fill="#ffd54f" stroke="#c99a00" stroke-width="1"/>`;
    if (lvl >= 6) extras += `<rect x="4" y="52" width="6" height="34" fill="#a1887f"/>`;
    if (lvl >= 7) extras += `<rect x="90" y="52" width="6" height="34" fill="#a1887f"/>`;
    if (lvl >= 8) extras += `<rect x="20" y="86" width="60" height="3" fill="#8d6e63"/>`;
    if (lvl >= 9) extras += `<circle cx="26" cy="70" r="3" fill="#fff3e0"/><circle cx="74" cy="70" r="3" fill="#fff3e0"/>`;
    // Türen in den Ständen (auf Bodenlinie)
    return `<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMax meet">
      <ellipse cx="50" cy="97" rx="44" ry="3" fill="rgba(0,0,0,0.15)"/>
      <rect x="8" y="48" width="84" height="40" fill="#ffe0b2" stroke="#bf8f5a" stroke-width="1.4"/>
      ${stallSvg}
      ${extras}
      <rect x="44" y="76" width="12" height="16" fill="#4a2f10"/>
    </svg>`;
  }

  if (type === 'mine') {
    const caveW = 36 + lvl * 1.6;
    let extras = '';
    if (lvl >= 2) extras += `<rect x="14" y="86" width="6" height="8" fill="#9e9e9e"/>`;
    if (lvl >= 3) extras += `<rect x="80" y="86" width="6" height="8" fill="#9e9e9e"/>`;
    if (lvl >= 4) extras += `<circle cx="50" cy="60" r="4" fill="#ffd54f" stroke="#c99a00" stroke-width="1"/>`;
    if (lvl >= 5) extras += `<rect x="36" y="30" width="8" height="20" fill="#6d4c41" stroke="#3e2723" stroke-width="1"/>`;
    if (lvl >= 6) extras += `<circle cx="50" cy="24" r="4" fill="#ffb300" stroke="#7a5c10" stroke-width="1"/>`;
    if (lvl >= 7) extras += `<rect x="20" y="48" width="6" height="40" fill="#4e342e"/><rect x="74" y="48" width="6" height="40" fill="#4e342e"/>`;
    if (lvl >= 8) extras += `<circle cx="20" cy="46" r="4" fill="#ffd54f"/>`;
    if (lvl >= 9) extras += `<rect x="44" y="8" width="12" height="12" fill="#c9a84c" stroke="#7a5c10" stroke-width="1"/>`;
    if (lvl >= 10) extras += `<circle cx="50" cy="4" r="3" fill="#ffd54f"/>`;
    // Tür (Höhleneingang) exakt auf Bodenlinie
    return `<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMax meet">
