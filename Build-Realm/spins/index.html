<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spin the Realm — Cards</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: radial-gradient(ellipse at 50% 30%, #1a1e3a 0%, #0a0d1f 60%, #05060e 100%);
    color: #e8ecf5;
  }

  .stars {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    overflow: hidden;
  }
  .star {
    position: absolute; width: 2px; height: 2px;
    background: #fff; border-radius: 50%;
    animation: twinkle 3s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.3; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.4); }
  }
  .bg-glow {
    position: fixed; border-radius: 50%;
    background: radial-gradient(circle, rgba(120,90,220,0.28), transparent 70%);
    pointer-events: none; z-index: 0;
    animation: floatBg 12s ease-in-out infinite;
  }
  @keyframes floatBg {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(40px, -30px) scale(1.15); }
  }

  /* ============ TOP BAR ============ */
  #topbar {
    position: fixed; top: 0; left: 0; right: 0; height: 62px;
    background: rgba(15,20,40,0.85);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid rgba(120,90,220,0.35);
    display: flex; align-items: center; padding: 0 18px; gap: 14px;
    z-index: 100;
    box-shadow: 0 4px 30px rgba(0,0,0,0.5);
  }
  .back-btn {
    display: inline-flex; align-items: center; gap: 8px;
    background: linear-gradient(135deg, #2a3260, #1a1f40);
    border: 1.5px solid rgba(120,150,220,0.5);
    color: #cdd6ec; padding: 9px 16px;
    border-radius: 10px; font-size: 13px; font-weight: 800;
    cursor: pointer; transition: all 0.15s;
    text-decoration: none;
  }
  .back-btn:hover {
    background: linear-gradient(135deg, #3a4280, #242a52);
    border-color: #7a8ad4;
    color: #fff;
    transform: translateX(-2px);
  }
  .back-btn svg { width: 16px; height: 16px; }

  .spin-logo {
    display: flex; align-items: center; gap: 10px;
    font-size: 20px; font-weight: 900; letter-spacing: 2px;
    text-transform: uppercase;
  }
  .spin-logo .accent {
    background: linear-gradient(90deg, #a87ee0, #7c4dbb, #a87ee0);
    background-size: 200% 100%;
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: logoShine 3s linear infinite;
  }
  @keyframes logoShine {
    to { background-position: 200% 50%; }
  }
  .spin-logo svg { width: 32px; height: 32px; }

  .topbar-spacer { flex: 1; }

  .gem-display {
    display: flex; align-items: center; gap: 8px;
    background: linear-gradient(135deg, #2a2050, #1a1230);
    border: 1.5px solid rgba(168,126,224,0.5);
    padding: 8px 16px; border-radius: 12px;
    font-size: 14px; font-weight: 800; color: #e0d0ff;
    box-shadow: 0 4px 20px rgba(168,126,224,0.3), inset 0 1px 0 rgba(255,255,255,0.1);
    transition: transform 0.2s;
  }
  .gem-display.bump { animation: gemBump 0.4s cubic-bezier(0.2,0.9,0.3,1.2); }
  @keyframes gemBump {
    0% { transform: scale(1); }
    50% { transform: scale(1.15); }
    100% { transform: scale(1); }
  }
  .gem-icon {
    width: 22px; height: 22px; flex-shrink: 0;
    filter: drop-shadow(0 0 6px rgba(168,126,224,0.8));
  }

  /* ============ MAIN LAYOUT ============ */
  #mainArea {
    position: fixed; top: 62px; left: 0; right: 0; bottom: 240px;
    display: flex; align-items: center; justify-content: center;
    z-index: 10;
    padding: 20px;
  }

  .spin-stage {
    display: flex; flex-direction: column;
    align-items: center; gap: 26px;
    max-width: 100%;
  }

  /* Die Karten-Ausstellung — passt sich an Fenstergröße an */
  .card-showcase {
    position: relative;
    width: clamp(200px, 22vh, 280px);
    height: clamp(280px, 30vh, 380px);
    display: flex; align-items: center; justify-content: center;
  }

  /* Karte */
  .spin-card {
    position: absolute;
    width: clamp(180px, 20vh, 260px);
    height: clamp(260px, 28vh, 360px);
    border-radius: 18px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    cursor: default;
    transform-style: preserve-3d;
    transition: all 0.6s cubic-bezier(0.2,0.9,0.3,1.2);
    overflow: hidden;
    will-change: transform;
  }
  .spin-card.flipping { animation: cardFlip 0.6s cubic-bezier(0.2,0.9,0.3,1.2); }
  @keyframes cardFlip {
    0% { transform: rotateY(0deg) scale(1); }
    50% { transform: rotateY(90deg) scale(0.92); }
    100% { transform: rotateY(0deg) scale(1); }
  }

  /* Idle-Karte (vor dem Spin) */
  .spin-card.idle {
    background: linear-gradient(160deg, #2a2050 0%, #141828 60%, #0a0d1f 100%);
    border: 2px solid rgba(168,126,224,0.4);
    box-shadow: 0 20px 50px rgba(0,0,0,0.6), 0 0 40px rgba(120,90,220,0.25);
  }
  .spin-card.idle .card-back-icon {
    width: clamp(70px, 8vh, 110px);
    height: clamp(70px, 8vh, 110px);
    animation: idlePulse 2s ease-in-out infinite;
  }
  @keyframes idlePulse {
    0%, 100% { transform: scale(1); opacity: 0.85; }
    50% { transform: scale(1.06); opacity: 1; }
  }
  .spin-card.idle .card-back-text {
    margin-top: 20px;
    font-size: clamp(11px, 1.4vh, 15px);
    letter-spacing: 4px;
    color: #8ea3c8; font-weight: 800;
    text-transform: uppercase;
  }

  /* Seltenheit: Farbe + Effekte */
  .spin-card.common {
    background: linear-gradient(160deg, #4a5040 0%, #2a2e28 60%, #181a16 100%);
    border: 2px solid #8a9380;
    box-shadow: 0 20px 50px rgba(0,0,0,0.6), 0 0 30px rgba(138,147,128,0.3);
  }
  .spin-card.uncommon {
    background: linear-gradient(160deg, #2e5a4a 0%, #1a3530 60%, #0e1e1a 100%);
    border: 2px solid #4ec9a0;
    box-shadow: 0 20px 50px rgba(0,0,0,0.6), 0 0 40px rgba(78,201,160,0.5);
  }
  .spin-card.rare {
    background: linear-gradient(160deg, #1e4a8a 0%, #102a50 60%, #081a2e 100%);
    border: 2px solid #4a9eff;
    box-shadow: 0 20px 50px rgba(0,0,0,0.6), 0 0 50px rgba(74,158,255,0.6);
  }
  .spin-card.epic {
    background: linear-gradient(160deg, #5a2a8a 0%, #2e1550 60%, #1a0d30 100%);
    border: 2px solid #b366ff;
    box-shadow: 0 20px 50px rgba(0,0,0,0.6), 0 0 60px rgba(179,102,255,0.7), inset 0 0 40px rgba(179,102,255,0.15);
  }
  .spin-card.legendary {
    background: linear-gradient(160deg, #8a6a00 0%, #4a3800 60%, #2a1e00 100%);
    border: 2px solid #ffd700;
    box-shadow: 0 20px 50px rgba(0,0,0,0.6), 0 0 80px rgba(255,215,0,0.8), inset 0 0 50px rgba(255,215,0,0.2);
    animation: legendaryPulse 1.6s ease-in-out infinite;
  }
  @keyframes legendaryPulse {
    0%, 100% { box-shadow: 0 20px 50px rgba(0,0,0,0.6), 0 0 60px rgba(255,215,0,0.7); }
    50% { box-shadow: 0 20px 50px rgba(0,0,0,0.6), 0 0 100px rgba(255,215,0,1); }
  }
  .spin-card.mythic {
    background: linear-gradient(160deg, #8a0000 0%, #4a0000 60%, #2a0000 100%);
    border: 2px solid #ff3a3a;
    box-shadow: 0 20px 50px rgba(0,0,0,0.7), 0 0 100px rgba(255,58,58,0.9), inset 0 0 50px rgba(255,58,58,0.25);
    animation: mythicPulse 1.2s ease-in-out infinite;
  }
  @keyframes mythicPulse {
    0%, 100% { box-shadow: 0 20px 50px rgba(0,0,0,0.7), 0 0 80px rgba(255,58,58,0.8); }
    50% { box-shadow: 0 20px 50px rgba(0,0,0,0.7), 0 0 140px rgba(255,58,58,1); }
  }

  .rainbow-ring {
    position: absolute; inset: -6px;
    border-radius: 22px;
    background: conic-gradient(from 0deg, #ff0000, #ff8000, #ffff00, #00ff00, #0080ff, #8000ff, #ff00ff, #ff0000);
    animation: spinRing 3s linear infinite;
    z-index: -1;
    opacity: 0.6;
    filter: blur(6px);
  }
  @keyframes spinRing { to { transform: rotate(360deg); } }

  .card-content {
    position: relative; z-index: 2;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    width: 100%; height: 100%;
    padding: 20px;
  }
  .card-unit-frame {
    width: clamp(80px, 12vh, 150px);
    height: clamp(80px, 12vh, 150px);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 14px;
    position: relative;
  }
  .card-unit-frame svg {
    width: 100%; height: 100%;
    filter: drop-shadow(0 6px 16px rgba(0,0,0,0.5));
  }
  .card-name {
    font-size: clamp(13px, 2vh, 18px);
    font-weight: 900;
    letter-spacing: 1.5px; text-transform: uppercase;
    text-align: center;
    margin-bottom: 6px;
  }
  .card-rarity {
    font-size: clamp(9px, 1.3vh, 12px);
    font-weight: 800;
    letter-spacing: 3px; text-transform: uppercase;
    padding: 4px 12px; border-radius: 8px;
    margin-bottom: 12px;
  }
  .card-type {
    font-size: clamp(9px, 1.3vh, 12px);
    font-weight: 700;
    color: rgba(255,255,255,0.7);
    letter-spacing: 1px; text-transform: uppercase;
    margin-bottom: 4px;
  }
  .card-stats {
    display: flex; gap: 12px;
    font-size: clamp(9px, 1.3vh, 12px);
    font-weight: 700;
    color: rgba(255,255,255,0.85);
  }
  .card-stats .st {
    display: flex; align-items: center; gap: 4px;
  }
  .card-stats .st svg { width: 12px; height: 12px; }

  .card-rarity.common { background: rgba(138,147,128,0.3); color: #b8c0b0; border: 1px solid #8a9380; }
  .card-rarity.uncommon { background: rgba(78,201,160,0.25); color: #7fefc4; border: 1px solid #4ec9a0; }
  .card-rarity.rare { background: rgba(74,158,255,0.25); color: #7dc0ff; border: 1px solid #4a9eff; }
  .card-rarity.epic { background: rgba(179,102,255,0.25); color: #d4a6ff; border: 1px solid #b366ff; }
  .card-rarity.legendary { background: rgba(255,215,0,0.25); color: #ffe066; border: 1px solid #ffd700; }
  .card-rarity.mythic { background: rgba(255,58,58,0.3); color: #ff9999; border: 1px solid #ff3a3a; }

  /* ============ SLOT MACHINE ============ */
  .slot-machine {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center; justify-content: center;
    z-index: 20;
    border-radius: 18px;
    overflow: hidden;
    background: linear-gradient(160deg, #0a0d1f 0%, #141828 60%, #0a0d1f 100%);
    border: 2px solid rgba(168,126,224,0.5);
    box-shadow: 0 20px 50px rgba(0,0,0,0.6), 0 0 40px rgba(120,90,220,0.4);
  }
  .slot-machine.show { display: flex; }

  /* Vertikaler Reel */
  .slot-reel {
    position: absolute;
    top: 0; left: 0; right: 0;
    display: flex; flex-direction: column;
    will-change: transform;
  }
  .slot-item {
    width: 100%;
    height: 160px;
    display: flex; align-items: center; justify-content: center;
    padding: 8px;
    flex-shrink: 0;
    position: relative;
  }
  .slot-item-inner {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    border-radius: 12px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .slot-item-inner svg {
    width: 80%; height: 80%;
  }

  /* Zeiger in der Mitte */
  .slot-pointer {
    position: absolute;
    top: 50%; left: 0; right: 0;
    transform: translateY(-50%);
    height: 160px;
    pointer-events: none;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 4px;
    z-index: 5;
  }
  .slot-pointer::before,
  .slot-pointer::after {
    content: '';
    width: 0; height: 0;
    border-style: solid;
  }
  .slot-pointer::before {
    border-width: 14px 16px 14px 0;
    border-color: transparent #a87ee0 transparent transparent;
    filter: drop-shadow(0 0 8px #a87ee0);
  }
  .slot-pointer::after {
    border-width: 14px 0 14px 16px;
    border-color: transparent transparent transparent #a87ee0;
    filter: drop-shadow(0 0 8px #a87ee0);
  }
  /* Puls bei jedem Tick */
  .slot-pointer.tick::before,
  .slot-pointer.tick::after {
    animation: pointerTick 0.15s ease-out;
  }
  @keyframes pointerTick {
    0% { filter: drop-shadow(0 0 8px #a87ee0) brightness(1); }
    50% { filter: drop-shadow(0 0 16px #d4a6ff) brightness(1.6); }
    100% { filter: drop-shadow(0 0 8px #a87ee0) brightness(1); }
  }

  /* Zeiger-Linie horizontal */
  .slot-center-line {
    position: absolute;
    top: 50%; left: 4px; right: 4px;
    height: 2px;
    transform: translateY(-50%);
    background: linear-gradient(90deg, transparent, rgba(168,126,224,0.6), transparent);
    pointer-events: none;
    z-index: 4;
  }

  /* Fade über/unter */
  .slot-fade-top,
  .slot-fade-bottom {
    position: absolute; left: 0; right: 0;
    height: 70px;
    pointer-events: none;
    z-index: 3;
  }
  .slot-fade-top {
    top: 0;
    background: linear-gradient(180deg, rgba(10,13,31,0.95), rgba(10,13,31,0));
  }
  .slot-fade-bottom {
    bottom: 0;
    background: linear-gradient(0deg, rgba(10,13,31,0.95), rgba(10,13,31,0));
  }

  /* Ausblend-Animation wenn fertig */
  .slot-machine.fadeout {
    animation: slotFadeOut 0.4s ease-out forwards;
  }
  @keyframes slotFadeOut {
    0% { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: scale(1.08); }
  }

  /* Spin-Button */
  .spin-btn-wrap {
    display: flex; flex-direction: column;
    align-items: center; gap: 10px;
  }
  .spin-btn {
    position: relative;
    display: inline-flex; align-items: center; justify-content: center; gap: 12px;
    padding: 16px 44px;
    background: linear-gradient(135deg, #7c4dbb, #a87ee0, #7c4dbb);
    background-size: 200% 100%;
    animation: btnShine 3s linear infinite;
    color: #fff;
    border: none; border-radius: 16px;
    font-size: 17px; font-weight: 900; letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer; transition: all 0.2s;
    box-shadow: 0 10px 30px rgba(124,77,187,0.5), inset 0 1px 0 rgba(255,255,255,0.3);
    font-family: inherit;
  }
  @keyframes btnShine { to { background-position: 200% 50%; } }
  .spin-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 14px 40px rgba(124,77,187,0.7); }
  .spin-btn:active:not(:disabled) { transform: translateY(0); }
  .spin-btn:disabled { opacity: 0.5; cursor: not-allowed; filter: grayscale(0.4); }
  .spin-btn svg { width: 22px; height: 22px; }
  .spin-cost {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(255,255,255,0.1);
    padding: 4px 10px; border-radius: 8px;
    font-size: 12px; font-weight: 800;
    letter-spacing: 0.5px;
  }
  .spin-cost svg { width: 14px; height: 14px; }

  .free-spin-banner {
    display: none; align-items: center; gap: 8px;
    padding: 10px 20px;
    background: linear-gradient(135deg, #2e7d32, #66bb6a);
    color: #fff;
    border-radius: 12px;
    font-size: 14px; font-weight: 900;
    letter-spacing: 2px; text-transform: uppercase;
    box-shadow: 0 6px 24px rgba(46,125,50,0.5);
    animation: freeBounce 0.6s ease-out;
  }
  .free-spin-banner.show { display: flex; }
  @keyframes freeBounce {
    0% { transform: scale(0.5); opacity: 0; }
    60% { transform: scale(1.1); }
    100% { transform: scale(1); opacity: 1; }
  }

  /* ============ COLLECTION BOTTOM ============ */
  #collection {
    position: fixed; bottom: 0; left: 0; right: 0; height: 240px;
    background: rgba(10,14,30,0.92);
    backdrop-filter: blur(20px);
    border-top: 1px solid rgba(120,90,220,0.35);
    z-index: 90;
    display: flex; flex-direction: column;
  }
  .coll-head {
    padding: 10px 18px;
    display: flex; align-items: center; gap: 14px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    flex-wrap: wrap;
  }
  .coll-title {
    font-size: 14px; font-weight: 900;
    letter-spacing: 2px; text-transform: uppercase;
    color: #a87ee0;
    display: flex; align-items: center; gap: 8px;
  }
  .coll-count {
    background: rgba(168,126,224,0.2);
    color: #d0b3f0;
    padding: 2px 10px;
    border-radius: 10px;
    font-size: 12px; font-weight: 800;
  }
  .coll-filters {
    display: flex; gap: 6px;
    margin-left: auto;
  }
  .filter-btn {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    color: #8ea3c8;
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 11px; font-weight: 800;
    letter-spacing: 0.5px; text-transform: uppercase;
    cursor: pointer; transition: all 0.15s;
  }
  .filter-btn:hover { background: rgba(255,255,255,0.1); color: #cdd6ec; }
  .filter-btn.active {
    background: rgba(168,126,224,0.25);
    border-color: #a87ee0;
    color: #d0b3f0;
  }

  .coll-body {
    flex: 1; overflow-x: auto; overflow-y: hidden;
    padding: 12px 18px;
    display: flex; gap: 10px;
    scroll-behavior: smooth;
  }
  .coll-body::-webkit-scrollbar { height: 8px; }
  .coll-body::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); border-radius: 4px; }
  .coll-body::-webkit-scrollbar-thumb { background: rgba(168,126,224,0.5); border-radius: 4px; }
  .coll-body::-webkit-scrollbar-thumb:hover { background: rgba(168,126,224,0.8); }

  .mini-card {
    flex-shrink: 0;
    width: 110px; height: 150px;
    border-radius: 10px;
    position: relative;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 8px;
    cursor: pointer;
    transition: all 0.2s;
    overflow: hidden;
  }
  .mini-card:hover {
    transform: translateY(-4px) scale(1.04);
    z-index: 5;
    box-shadow: 0 12px 30px rgba(0,0,0,0.5);
  }
  .mini-card.common {
    background: linear-gradient(160deg, #4a5040, #181a16);
    border: 1.5px solid #8a9380;
  }
  .mini-card.uncommon {
    background: linear-gradient(160deg, #2e5a4a, #0e1e1a);
    border: 1.5px solid #4ec9a0;
    box-shadow: 0 0 12px rgba(78,201,160,0.4);
  }
  .mini-card.rare {
    background: linear-gradient(160deg, #1e4a8a, #081a2e);
    border: 1.5px solid #4a9eff;
    box-shadow: 0 0 16px rgba(74,158,255,0.5);
  }
  .mini-card.epic {
    background: linear-gradient(160deg, #5a2a8a, #1a0d30);
    border: 1.5px solid #b366ff;
    box-shadow: 0 0 22px rgba(179,102,255,0.6);
  }
  .mini-card.legendary {
    background: linear-gradient(160deg, #8a6a00, #2a1e00);
    border: 1.5px solid #ffd700;
    box-shadow: 0 0 28px rgba(255,215,0,0.7);
  }
  .mini-card.mythic {
    background: linear-gradient(160deg, #8a0000, #2a0000);
    border: 1.5px solid #ff3a3a;
    box-shadow: 0 0 32px rgba(255,58,58,0.8);
  }
  .mini-card .mc-icon {
    width: 60px; height: 60px;
    margin-bottom: 6px;
  }
  .mini-card .mc-icon svg { width: 100%; height: 100%; }
  .mini-card .mc-name {
    font-size: 10px; font-weight: 800;
    text-align: center; line-height: 1.15;
    color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,0.6);
  }
  .mini-card .mc-count {
    position: absolute; top: 5px; right: 5px;
    background: rgba(0,0,0,0.6);
    color: #fff;
    font-size: 10px; font-weight: 900;
    padding: 2px 6px; border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.25);
  }

  .empty-coll {
    color: #5c7099; font-size: 13px; font-style: italic;
    display: flex; align-items: center; padding: 20px;
  }

  /* ============ RESULT OVERLAY ============ */
  #resultOverlay {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(10px);
    display: none; align-items: center; justify-content: center;
    padding: 20px;
    animation: overlayFade 0.4s ease;
  }
  #resultOverlay.show { display: flex; }
  @keyframes overlayFade { from { opacity: 0; } to { opacity: 1; } }

/* ============ FIREBASE INIT ============ */
function whenFirebaseReady(cb) {
  if (window.__SPIN_db) { cb(); return; }
  window.addEventListener('spin-firebase-ready', cb, { once: true });
}

whenFirebaseReady(async () => {
  const db = window.__SPIN_db;
  const { ref, get } = window.__SPIN_fns;

  const storedHwid = localStorage.getItem('br_last_hwid');
  let foundHwid = null;

  if (storedHwid) {
    try {
      const snap = await get(ref(db, 'saves/' + storedHwid));
      if (snap.exists()) foundHwid = storedHwid;
    } catch(e) {}
  }

  if (!foundHwid) {
    const lastHwid = localStorage.getItem('br_hwid');
    if (lastHwid) {
      try {
        const snap = await get(ref(db, 'saves/' + lastHwid));
        if (snap.exists()) foundHwid = lastHwid;
      } catch(e) {}
    }
  }

  if (!foundHwid) {
    document.getElementById('loadOverlay').classList.add('hidden');
    document.getElementById('noUserOverlay').classList.add('show');
    return;
  }

  hwid = foundHwid;
  await initUserData();
});

async function initUserData() {
  const db = window.__SPIN_db;
  const { ref, get, update } = window.__SPIN_fns;

  try {
    const snap = await get(ref(db, 'saves/' + hwid));
    if (!snap.exists()) {
      document.getElementById('loadOverlay').classList.add('hidden');
      document.getElementById('noUserOverlay').classList.add('show');
      return;
    }
    const data = snap.val();
    gems = data.gems != null ? Number(data.gems) : 0;
    cardsCollection = data.cards || {};

    document.getElementById('hwidChipText').textContent = hwid.slice(0, 16) + '…';
    document.getElementById('hwidChip').classList.add('show');

    if (data.gems == null && data.cards == null) {
      gems = 25;
      await update(ref(db, 'saves/' + hwid), { gems: 25, cards: {} });
      cardsCollection = {};
    }

    updateGemDisplay();
    renderCollection();
    document.getElementById('loadOverlay').classList.add('hidden');
  } catch(e) {
    console.error(e);
    document.getElementById('loadOverlay').classList.add('hidden');
    document.getElementById('noUserOverlay').classList.add('show');
  }
}

/* ============ SPIN LOGIC ============ */
function rollRarity() {
  const roll = Math.random() * 100;
  let cumulative = 0;
  const order = ['common', 'uncommon', 'rare', 'epic', 'legendary', 'mythic', 'spinAgain'];
  for (const r of order) {
    cumulative += RARITIES[r].chance;
    if (roll < cumulative) return r;
  }
  return 'common';
}

function pickCard(rarity) {
  const pool = CARD_POOL[rarity];
  if (!pool || pool.length === 0) return null;
  const picked = pool[Math.floor(Math.random() * pool.length)];
  return { rarity, type: picked.type, name: picked.name };
}

/* ============ SLOT MACHINE ============ */
const SLOT_ITEM_HEIGHT = 160; // muss mit CSS übereinstimmen

function buildSlotItems(targetCard, reelLength = 30) {
  // Wir bauen eine Liste von zufälligen Karten + die Ziel-Karte an einer Position
  const items = [];
  const allCards = [];
  // Alle möglichen Karten sammeln für zufällige Anzeige
  for (const rar in CARD_POOL) {
    CARD_POOL[rar].forEach(c => allCards.push({ rarity: rar, type: c.type, name: c.name }));
  }

  // Ziel-Position: in der Mitte der letzten ~5
  const targetIndex = reelLength - 3;

  for (let i = 0; i < reelLength; i++) {
    if (i === targetIndex) {
      items.push(targetCard);
    } else {
      // Zufällige Karte, aber nicht die Ziel-Karte
      let rand;
      let attempts = 0;
      do {
        rand = allCards[Math.floor(Math.random() * allCards.length)];
        attempts++;
      } while (rand.rarity === targetCard.rarity && rand.name === targetCard.name && attempts < 10);
      items.push(rand);
    }
  }
  return { items, targetIndex };
}

function renderSlotItems(items) {
  const reel = document.getElementById('slotReel');
  reel.innerHTML = items.map(card => {
    const rar = RARITIES[card.rarity] || RARITIES.common;
    return `<div class="slot-item"><div class="slot-item-inner">${unitSVG(card.type, card.rarity)}</div></div>`;
  }).join('');
}

async function playSlotAnimation(targetCard) {
  return new Promise((resolve) => {
    const slot = document.getElementById('slotMachine');
    const reel = document.getElementById('slotReel');
    const pointer = document.getElementById('slotPointer');

    // Baue Items
    const reelLength = 28;
    const { items, targetIndex } = buildSlotItems(targetCard, reelLength);
    renderSlotItems(items);

    // Reel-Position initial ganz oben
    reel.style.transition = 'none';
    reel.style.transform = 'translateY(0px)';
    slot.classList.add('show');
    slot.classList.remove('fadeout');

    // Ziel-Offset: mittlerer Slot in der Card-Showcase
    // Die Showcase hat eine Höhe von ~card height. Wir nehmen an, dass der sichtbare Bereich
    // ca. 3 Items hoch ist. Der "Center"-Slot ist bei Index targetIndex.
    const showcase = document.getElementById('cardShowcase');
    const showcaseHeight = showcase.clientHeight;
    // Aktuelle Item-Höhe (CSS responsive)
    const itemEl = reel.querySelector('.slot-item');
    const itemHeight = itemEl ? itemEl.offsetHeight : SLOT_ITEM_HEIGHT;

    // Center = Höhe/2. Ziel-Item soll in der Mitte stehen.
    // Also: reel muss so verschoben werden, dass targetIndex*itemHeight + itemHeight/2 = showcaseHeight/2
    const targetOffset = targetIndex * itemHeight + itemHeight / 2 - showcaseHeight / 2;

    // Total-Distanz für die Animation
    const totalDistance = targetOffset;

    // Dauer abhängig von Distanz
    const duration = 2800 + Math.random() * 400;
    const startTime = performance.now();

    // Tick-Handler für Zeiger-Animation
    let lastTick = -1;
    function tickAt(index) {
      if (index === lastTick) return;
      lastTick = index;
      pointer.classList.remove('tick');
      void pointer.offsetWidth;
      pointer.classList.add('tick');
      // Kleines Sound-Feedback (Vibration auf Mobile)
      if (navigator.vibrate && index % 2 === 0) {
        try { navigator.vibrate(8); } catch(e) {}
      }
    }

    function animate(currentTime) {
      const elapsed = currentTime - startTime;
      const t = Math.min(1, elapsed / duration);
      // Ease-out cubic
      const eased = 1 - Math.pow(1 - t, 3);

      // Zusätzliche "Wobble"-Phase kurz vor Ende
      let offset = totalDistance * eased;

      // Kurzer Rückwärts-Wobble am Ende (overshoot)
      if (t > 0.9) {
        const overshoot = Math.sin((t - 0.9) * Math.PI * 10) * 8 * (1 - t);
        offset += overshoot;
      }

      reel.style.transform = `translateY(${-offset}px)`;

      // Zeiger-Tick basierend auf aktueller Position
      const currentIndex = Math.floor(offset / itemHeight);
      tickAt(currentIndex);

      if (t < 1) {
        requestAnimationFrame(animate);
      } else {
        // Fertig — leichte Korrektur
        reel.style.transform = `translateY(${-targetOffset}px)`;

        // Kurzer "Hold" — Zeiger poppt noch einmal
        pointer.classList.remove('tick');
        void pointer.offsetWidth;
        pointer.classList.add('tick');

        // Fade-out
        slot.classList.add('fadeout');
        setTimeout(() => {
          slot.classList.remove('show', 'fadeout');
          resolve();
        }, 400);
      }
    }
    requestAnimationFrame(animate);
  });
}

/* ============ SPIN ACTION ============ */
async function doSpin() {
  if (spinning) return;
  if (!freeSpinAvailable && gems < SPIN_COST) {
    notify('Not enough gems!', true);
    return;
  }
  spinning = true;
  const btn = document.getElementById('spinBtn');
  btn.disabled = true;

  const wasFree = freeSpinAvailable;

  // Kosten abziehen (außer free spin)
  if (!wasFree) {
    gems -= SPIN_COST;
    updateGemDisplay(true);
  } else {
    freeSpinAvailable = false;
    document.getElementById('freeSpinBanner').classList.remove('show');
  }

  // Roll die Rarity und Karte ZUERST (Ergebnis steht fest)
  const rarity = rollRarity();

  // Bei Free Spin: kein Slot, sondern direkt Banner
  if (rarity === 'spinAgain') {
    // Kosten zurückerstatten? Nein — Free Spin ist ein Bonus
    // Aber wir geben den Einsatz zurück
    if (!wasFree) {
      gems += SPIN_COST;
      updateGemDisplay(false);
    }
    freeSpinAvailable = true;
    document.getElementById('freeSpinBanner').classList.add('show');
    spawnConfetti(20, '#4caf50');
    notify('⚡ FREE SPIN! Spin again for free', false, true);
    spinning = false;
    btn.disabled = false;
    updateSpinButton();
    // Speichern
    saveProgress();
    return;
  }

  const pulled = pickCard(rarity);
  if (!pulled) { spinning = false; btn.disabled = false; return; }

  // Slot-Machine-Animation abspielen
  await playSlotAnimation(pulled);

  // Zeige Ergebnis-Overlay
  showResult(pulled);

  // In Collection speichern
  const key = cardId(pulled.rarity, pulled.type, pulled.name);
  if (!cardsCollection[key]) {
    cardsCollection[key] = { rarity: pulled.rarity, type: pulled.type, name: pulled.name, count: 0 };
  }
  cardsCollection[key].count = (cardsCollection[key].count || 0) + 1;

  renderCollection();

  // Speichern (sowohl gems als auch cards)
  await saveProgress();

  // Re-enable
  spinning = false;
  btn.disabled = false;
  updateSpinButton();
}

function updateSpinButton() {
  const btn = document.getElementById('spinBtn');
  const cost = document.getElementById('spinCostVal');
  const text = document.getElementById('spinBtnText');
  if (freeSpinAvailable) {
    text.textContent = 'FREE SPIN';
    cost.parentElement.style.display = 'none';
    btn.disabled = false;
  } else {
    text.textContent = 'SPIN';
    cost.parentElement.style.display = '';
    cost.textContent = SPIN_COST;
    btn.disabled = gems < SPIN_COST || spinning;
  }
}

/* ============ RESULT OVERLAY ============ */
function showResult(pulled) {
  const overlay = document.getElementById('resultOverlay');
  const headline = document.getElementById('resultHeadline');
  const cardWrap = document.getElementById('resultCardWrap');

  const rar = RARITIES[pulled.rarity];
  headline.textContent = `${rar.name} Pull!`;
  headline.className = 'result-headline ' + pulled.rarity;

  cardWrap.innerHTML = renderFullCard(pulled);

  overlay.classList.add('show');

  if (pulled.rarity === 'legendary' || pulled.rarity === 'mythic') {
    document.body.classList.add('shake');
    setTimeout(() => document.body.classList.remove('shake'), 600);
    spawnConfetti(pulled.rarity === 'mythic' ? 150 : 100, rar.color);
  } else if (pulled.rarity === 'epic') {
    spawnConfetti(60, rar.color);
  } else if (pulled.rarity === 'rare') {
    spawnConfetti(30, rar.color);
  } else if (pulled.rarity === 'uncommon') {
    spawnConfetti(15, rar.color);
  }
}

function renderFullCard(pulled) {
  const rar = RARITIES[pulled.rarity];
  const stats = getCardStats(pulled.rarity, pulled.type);
  const rainbow = pulled.rarity === 'legendary' || pulled.rarity === 'mythic';
  return `
    <div class="spin-card ${pulled.rarity}" style="position:relative;">
      ${rainbow ? '<div class="rainbow-ring"></div>' : ''}
      <div class="card-content">
        <div class="card-unit-frame">${unitSVG(pulled.type, pulled.rarity)}</div>
        <div class="card-name" style="color:${rar.color};">${escapeHtml(pulled.name)}</div>
        <div class="card-rarity ${pulled.rarity}">${rar.name}</div>
        <div class="card-type">${pulled.type}</div>
        <div class="card-stats">
          <div class="st">
            <svg viewBox="0 0 24 24" fill="#e53935"><path d="M12 21s-7-4-7-10V5l7-3 7 3v6c0 6-7 10-7 10z"/></svg>
            ${stats.hp}
          </div>
          <div class="st">
            <svg viewBox="0 0 24 24" fill="#ffb300"><path d="M14.5 17.5 L3 6 V3 h3 l11.5 11.5 M13 19 l6-6"/></svg>
            ${stats.damage}
          </div>
        </div>
      </div>
    </div>
  `;
}

function renderMiniCard(card) {
  const rar = RARITIES[card.rarity];
  return `
    <div class="mini-card ${card.rarity}" data-key="${cardId(card.rarity, card.type, card.name)}">
      ${card.count > 1 ? `<div class="mc-count">×${card.count}</div>` : ''}
      <div class="mc-icon">${unitSVG(card.type, card.rarity)}</div>
      <div class="mc-name" style="color:${rar.color};">${escapeHtml(card.name)}</div>
    </div>
  `;
}

/* ============ COLLECTION ============ */
function renderCollection() {
  const body = document.getElementById('collBody');
  const entries = Object.entries(cardsCollection);
  if (entries.length === 0) {
    body.innerHTML = '<div class="empty-coll">No cards yet — spin to collect!</div>';
    updateCollectionCount();
    return;
  }
  entries.sort((a, b) => {
    const ra = RARITIES[a[1].rarity]?.order || 0;
    const rb = RARITIES[b[1].rarity]?.order || 0;
    if (rb !== ra) return rb - ra;
    return (a[1].name || '').localeCompare(b[1].name || '');
  });
  const filtered = currentFilter === 'all'
    ? entries
    : entries.filter(([k, v]) => v.rarity === currentFilter);

  if (filtered.length === 0) {
    body.innerHTML = '<div class="empty-coll">No cards in this filter.</div>';
    updateCollectionCount();
    return;
  }

  body.innerHTML = filtered.map(([k, v]) => renderMiniCard(v)).join('');
  body.querySelectorAll('.mini-card').forEach(el => {
    el.onclick = () => {
      const key = el.dataset.key;
      const card = cardsCollection[key];
      if (!card) return;
      showCardDetail(card);
    };
  });
  updateCollectionCount();
}

function showCardDetail(card) {
  const overlay = document.getElementById('resultOverlay');
  const headline = document.getElementById('resultHeadline');
  const cardWrap = document.getElementById('resultCardWrap');
  const rar = RARITIES[card.rarity];
  headline.textContent = `${rar.name} — ${card.count}×`;
  headline.className = 'result-headline ' + card.rarity;
  cardWrap.innerHTML = renderFullCard(card);
  overlay.classList.add('show');
}

function updateCollectionCount() {
  const total = Object.values(cardsCollection).reduce((sum, c) => sum + (c.count || 0), 0);
  const unique = Object.keys(cardsCollection).length;
  document.getElementById('collCount').textContent = `${unique} unique · ${total} total`;
}

function getCardStats(rarity, type) {
  const base = {
    soldier:  { hp: 100, damage: 8 },
    archer:   { hp: 70,  damage: 14 },
    spearman: { hp: 90,  damage: 12 },
    tank:     { hp: 300, damage: 10 },
    elite:    { hp: 220, damage: 18 }
  }[type] || { hp: 100, damage: 8 };

  const mult = {
    common: 1.0, uncommon: 1.3, rare: 1.7,
    epic: 2.3, legendary: 3.2, mythic: 4.5
  }[rarity] || 1.0;

  return {
    hp: Math.round(base.hp * mult),
    damage: Math.round(base.damage * mult)
  };
}

/* ============ CONFETTI ============ */
function spawnConfetti(count, baseColor) {
  const layer = document.getElementById('confettiLayer');
  const colors = baseColor
    ? [baseColor, '#fff', baseColor, lighten(baseColor, 30)]
    : ['#ff3a3a', '#ffd700', '#4a9eff', '#b366ff', '#4ec9a0', '#fff'];
  for (let i = 0; i < count; i++) {
    const el = document.createElement('div');
    el.className = 'confetti';
    el.style.left = Math.random() * 100 + '%';
    el.style.top = '-20px';
    el.style.background = colors[Math.floor(Math.random() * colors.length)];
    el.style.width = (6 + Math.random() * 8) + 'px';
    el.style.height = (6 + Math.random() * 8) + 'px';
    el.style.borderRadius = Math.random() < 0.5 ? '50%' : '2px';
    const dur = 2 + Math.random() * 2;
    el.style.animationDuration = dur + 's';
    el.style.animationDelay = (Math.random() * 0.5) + 's';
    layer.appendChild(el);
    setTimeout(() => el.remove(), (dur + 1) * 1000);
  }
}
function lighten(hex, amt) {
  const n = parseInt(hex.replace('#',''), 16);
  let r = Math.min(255, (n >> 16) + amt);
  let g = Math.min(255, ((n >> 8) & 0xff) + amt);
  let b = Math.min(255, (n & 0xff) + amt);
  return '#' + ((r << 16) | (g << 8) | b).toString(16).padStart(6, '0');
}

/* ============ NOTIFY ============ */
function notify(msg, bad, good) {
  const el = document.createElement('div');
  el.textContent = msg;
  el.style.cssText = `
    position:fixed;top:76px;left:50%;transform:translateX(-50%);
    background:${bad ? 'linear-gradient(135deg,#c62828,#e53935)' : good ? 'linear-gradient(135deg,#2e7d32,#4caf50)' : 'linear-gradient(135deg,#5a2a9a,#7c4dbb)'};
    color:#fff;padding:12px 24px;border-radius:12px;
    font-size:14px;font-weight:800;letter-spacing:1px;
    box-shadow:0 8px 30px rgba(0,0,0,0.5);
    z-index:500;animation:overlayFade 0.3s ease;
    text-transform:uppercase;
  `;
  document.body.appendChild(el);
  setTimeout(() => {
    el.style.transition = 'opacity 0.4s';
    el.style.opacity = '0';
    setTimeout(() => el.remove(), 400);
  }, 2500);
}

/* ============ STARS ============ */
(function makeStars() {
  const wrap = document.getElementById('stars');
  for (let i = 0; i < 100; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 100 + '%';
    s.style.animationDelay = (Math.random() * 3) + 's';
    const sz = 1 + Math.random() * 2;
    s.style.width = sz + 'px';
    s.style.height = sz + 'px';
    wrap.appendChild(s);
  }
})();

/* ============ EVENT HANDLERS ============ */
document.getElementById('spinBtn').onclick = () => doSpin();

document.getElementById('resultClose').onclick = () => {
  document.getElementById('resultOverlay').classList.remove('show');
};
document.getElementById('resultAgain').onclick = () => {
  document.getElementById('resultOverlay').classList.remove('show');
  setTimeout(() => doSpin(), 200);
};

document.getElementById('resultOverlay').addEventListener('click', (e) => {
  if (e.target.id === 'resultOverlay') {
    e.target.classList.remove('show');
  }
});

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    renderCollection();
  };
});

window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    document.getElementById('resultOverlay').classList.remove('show');
  }
});

setTimeout(() => updateSpinButton(), 500);

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}

window.__SPIN = { doSpin, updateGemDisplay, renderCollection, saveProgress };
</script>
